<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Sistema Club de Bochas - Gestión</title>

    <style>
        #error-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            color: #ff5555;
            z-index: 9999;
            padding: 40px;
            font-family: monospace;
            font-size: 16px;
            white-space: pre-wrap;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
            background-color: #111827;
            color: white;
        }

        .fast-input {
            contain: content;
        }

        /* Reglas de exportación A4 Vertical (Portrait) con 15mm de margen */
        @page {
            size: A4 portrait;
            margin: 15mm;
        }

        @media print {
            html, body {
                background: #ffffff !important;
                color: #111827 !important;
                height: auto !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            .page-break-inside-avoid, .report-section, tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .page-break-before {
                page-break-before: always !important;
                break-before: always !important;
            }

            table {
                page-break-inside: auto;
                border-collapse: collapse;
                width: 100%;
            }

            thead {
                display: table-header-group;
            }

            tfoot {
                display: table-footer-group;
            }
        }
    </style>
</head>

<body class="bg-gray-900 h-screen overflow-hidden">

    <div id="error-overlay"></div>
    <div id="root" class="h-full"></div>

    <script>
        window.onerror = function (msg, url, line) {
            const ov = document.getElementById('error-overlay');
            ov.style.display = 'block';
            ov.textContent = "⛔ ERROR:\n" + msg + "\nEn: " + url + ":" + line;
            return false;
        };
    </script>

    <script src="./libs/tailwindcss.js"></script>
    <script src="./libs/react.development.js"></script>
    <script src="./libs/react-dom.development.js"></script>
    <script src="./libs/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- ICONOS SVG ---
        const Icon = ({ d, color = "currentColor", size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {d}
            </svg>
        );

        const Pizza = (p) => <Icon {...p} d={<><path d="M15 11h.01" /><path d="M11 15h.01" /><path d="M16 16h.01" /><path d="m2 16 20 6-6-20A20 20 0 0 0 2 16" /><path d="M5.71 17.11a17.04 17.04 0 0 1 11.4-11.4" /></>} />;
        const ChefHat = (p) => <Icon {...p} d={<><path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 1 0-7.454-3.489A3.999 3.999 0 0 0 5.273 13.61c.41.197.727.584.727 1.041V20a1 1 0 0 0 1 1h10z" /><path d="M6 17h12" /></>} />;
        const Trash2 = (p) => <Icon {...p} d={<><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></>} />;
        const Users = (p) => <Icon {...p} d={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>} />;
        const Utensils = (p) => <Icon {...p} d={<><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" /><path d="M7 2v20" /><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" /></>} />;
        const Monitor = (p) => <Icon {...p} d={<><rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" /></>} />;
        const User = (p) => <Icon {...p} d={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>} />;
        const Settings = (p) => <Icon {...p} d={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V2a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></>} />;
        const X = (p) => <Icon {...p} d={<><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>} />;
        const ZoomIn = (p) => <Icon {...p} d={<><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="11" x2="11" y1="8" y2="14" /><line x1="8" x2="14" y1="11" y2="11" /></>} />;
        const ZoomOut = (p) => <Icon {...p} d={<><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="11" x2="11" y1="8" y2="14" /><line x1="8" x2="14" y1="11" y2="11" /></>} />;
        const AlertCircle = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></>} />;
        const Check = (p) => <Icon {...p} d={<><polyline points="20 6 9 17 4 12" /></>} />;
        const DollarSign = (p) => <Icon {...p} d={<><line x1="12" x2="12" y1="2" y2="22" /><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></>} />;
        const AlertTriangle = (p) => <Icon {...p} d={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" x2="12" y1="9" y2="13" /><line x1="12" x2="12.01" y1="17" y2="17" /></>} />;
        const HelpCircle = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" x2="12.01" y1="17" y2="17" /></>} />;
        const PackageIcon = (p) => <Icon {...p} d={<><path d="m7.5 4.27 9 5.15" /><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" /></>} />;
        const CupSoda = (p) => <Icon {...p} d={<><path d="m6 8 1.75 12.28a2 2 0 0 0 2 1.72h4.5a2 2 0 0 0 2-1.72L18 8" /><path d="M5 8h14" /><path d="M7 15a6.47 6.47 0 0 1 5 0 6.47 6.47 0 0 0 5 0" /><line x1="12" x2="12" y1="8" y2="2" /></>} />;
        const FileText = (p) => <Icon {...p} d={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></>} />;
        const Download = (p) => <Icon {...p} d={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></>} />;
        const Calendar = (p) => <Icon {...p} d={<><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></>} />;
        const RotateCw = (p) => <Icon {...p} d={<><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></>} />;
        const LogOut = (p) => <Icon {...p} d={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" x2="9" y1="12" y2="12" /></>} />;
        const DEFAULT_FLAVORS = ["Muzzarella", "Provenzal", "Cebolla", "Calabresa", "Margarita", "Napolitana", "Anchoa", "Rúcula", "Especial", "3 Quesos", "Roquefort"];
        const INITIAL_PRICES = {
            box: 0,
            empanada: 0,
            pizzaLibreH: 0,
            flavors: DEFAULT_FLAVORS.reduce((acc, f) => { acc[f] = { entera: 0, media: 0 }; return acc; }, {}),
            drinks: {}
        };

        const storage = window.__BOCHAS_STORAGE__ || {
            loadInitial: async () => ({ orders: [], libres: [], prices: INITIAL_PRICES, history: [] }),
            set: async () => { },
            openNewWindow: () => { },
            clearAll: async () => { },
            savePDF: async () => ({ success: false, error: 'No electron bridge' }),
            onUpdate: () => () => { }
        };

        const getLocalDateString = (dateObj = new Date()) => {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const ActiveLibresList = ({ libres, onRound, onClose }) => {
            if (!libres || libres.length === 0) return (
                <div className="flex-1 flex items-center justify-center text-gray-400 italic text-xs p-4">Sin mesas activas</div>
            );
            return (
                <div className="flex-1 overflow-y-auto space-y-2 p-2">
                    {libres.map(l => (
                        <div key={l.id} className="bg-white rounded shadow-sm border-l-4 border-purple-500 p-2 flex flex-col gap-1.5">
                            <div className="flex justify-between items-center">
                                <span className="font-black text-gray-800 text-sm truncate">{l.client}</span>
                                <span className="text-[10px] text-gray-500 font-mono">{l.timestamp}</span>
                            </div>
                            <div className="flex justify-between items-center text-xs">
                                <span className="font-bold text-purple-700 bg-purple-50 px-1.5 py-0.5 rounded">{l.people} pers.</span>
                                {l.obs && <span className="text-gray-500 italic truncate max-w-[100px]">{l.obs}</span>}
                            </div>
                            <div className="flex gap-1 mt-1">
                                <button onClick={() => onRound(l)} className="flex-1 bg-purple-100 hover:bg-purple-200 text-purple-700 py-1 rounded text-xs font-bold transition flex items-center justify-center gap-1">
                                    <RotateCw size={12} /> +Ronda ({l.round || 1}ª)
                                </button>
                                <button onClick={() => onClose(l)} className="bg-red-50 hover:bg-red-100 text-red-600 px-2 py-1 rounded text-xs font-bold transition relative group" title="Cerrar y Cobrar">
                                    <LogOut size={14} />
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const KitchenOrdersList = ({ orders, onComplete, onDelete, prices }) => {
            const cartaOrders = orders.filter(o => o.type !== 'libre');
            if (!cartaOrders || cartaOrders.length === 0) return (
                <div className="flex-1 flex items-center justify-center text-gray-400 italic text-xs p-4 bg-slate-100">Sin pedidos</div>
            );
            return (
                <div className="flex-1 overflow-y-auto p-2 space-y-2 bg-slate-100">
                    {cartaOrders.map(o => (
                        <div key={o.id} className="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                            <div className="bg-slate-200 px-2 py-1.5 flex justify-between items-center border-b border-gray-200">
                                <div className="font-black text-slate-800 text-xs truncate max-w-[150px]">{o.client}</div>
                                <div className="text-[10px] font-mono text-slate-500">{o.timestamp}</div>
                            </div>
                            <div className="p-2 space-y-1.5 text-xs text-gray-700 flex-1">
                                {o.obs && (
                                    <div className="bg-yellow-50 text-yellow-800 p-1 rounded font-bold border border-yellow-200 flex gap-1 items-start">
                                        <AlertCircle size={12} className="shrink-0 mt-0.5" /> <span>{o.obs}</span>
                                    </div>
                                )}
                                {o.pizzas && o.pizzas.map((p, i) => (
                                    <div key={i} className="flex justify-between font-medium">
                                        <span><span className="font-bold">{p.qty}x</span> {p.description} {p.withBox && '📦'}</span>
                                        {p.obs && <span className="text-orange-600 italic ml-1">({p.obs})</span>}
                                    </div>
                                ))}
                                {o.drinks && o.drinks.map((d, i) => (
                                    <div key={`d${i}`} className="flex justify-between font-medium text-blue-800">
                                        <span><span className="font-bold">{d.qty}x</span> {d.name}</span>
                                    </div>
                                ))}
                                {o.empanadas > 0 && (
                                    <div className="font-bold text-yellow-700">{o.empanadas}x Empanadas</div>
                                )}
                            </div>
                            <div className="bg-gray-50 p-1.5 flex gap-1 border-t border-gray-200 mt-auto">
                                <button onClick={() => onComplete(o)} className="bg-green-500 hover:bg-green-600 text-white font-bold py-1.5 px-2 rounded flex items-center justify-center gap-1 shadow-sm transition flex-1 text-[11px]">
                                    <Check size={12} /> LISTO
                                </button>
                                <button onClick={() => onDelete(o)} className="bg-red-100 hover:bg-red-200 text-red-600 px-2 rounded flex items-center justify-center transition" title="Eliminar sin sumar">
                                    <Trash2 size={12} />
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // --- COMPONENTE DE REPORTE Y GUARDADO DE PDF POR FECHA ---
        const ReportModal = ({ isOpen, onClose, history, activeLibres, orders, prices }) => {
            if (!isOpen) return null;

            const todayStr = useMemo(() => getLocalDateString(new Date()), []);
            const [selectedDate, setSelectedDate] = useState(todayStr);
            const [isSaving, setIsSaving] = useState(false);
            const [saveStatus, setSaveStatus] = useState(null);

            // Filtrar historial según la fecha seleccionada
            const filteredHistory = useMemo(() => {
                if (selectedDate === 'all') return history;
                return history.filter(item => {
                    if (item.date) return item.date === selectedDate;
                    if (item.completedAt) {
                        try {
                            const itemDate = getLocalDateString(new Date(item.completedAt));
                            return itemDate === selectedDate;
                        } catch (_) {
                            return item.completedAt.startsWith(selectedDate);
                        }
                    }
                    return selectedDate === todayStr;
                });
            }, [history, selectedDate, todayStr]);

            const isViewingToday = selectedDate === todayStr || selectedDate === 'all';
            const displayActiveLibres = isViewingToday ? (activeLibres || []) : [];
            const displayActiveCarta = isViewingToday ? (orders || []).filter(o => o.type !== 'libre') : [];

            // Mesas Libres Cerradas (Facturadas)
            const closedLibres = filteredHistory.filter(o => o.type === 'libre');
            const totalLibresCerradas = closedLibres.reduce((sum, l) => sum + (Number(l.totalPrice) || ((Number(l.people) || 0) * (Number(prices.pizzaLibreH) || 0))), 0);
            const totalPersonasLibresCerradas = closedLibres.reduce((sum, l) => sum + (Number(l.people) || 0), 0);

            // Mesas Libres Activas
            const totalLibresActivas = displayActiveLibres.reduce((sum, l) => sum + ((Number(l.people) || 0) * (Number(prices.pizzaLibreH) || 0)), 0);
            const totalPersonasLibresActivas = displayActiveLibres.reduce((sum, l) => sum + (Number(l.people) || 0), 0);

            // Total General Libres
            const granTotalLibres = totalLibresCerradas + totalLibresActivas;
            const granTotalPersonasLibres = totalPersonasLibresCerradas + totalPersonasLibresActivas;

            // Pedidos A La Carta Completados
            const completedCarta = filteredHistory.filter(o => o.type !== 'libre');
            const totalCarta = completedCarta.reduce((sum, o) => sum + (Number(o.totalPrice) || 0), 0);

            // Pedidos A La Carta En Cocina
            const totalCartaActivos = displayActiveCarta.reduce((sum, o) => sum + (Number(o.totalPrice) || 0), 0);

            // Gran Total General
            const granTotalRecaudado = totalLibresCerradas + totalCarta;
            const granTotalConActivos = granTotalRecaudado + totalLibresActivas + totalCartaActivos;

            // Desglose de Empanadas
            const empanadasVendidas = completedCarta.reduce((sum, o) => sum + (Number(o.empanadas) || 0), 0);
            const totalEmpanadasMonto = empanadasVendidas * (Number(prices.empanada) || 0);

            // Desglose de Bebidas
            const bebidasStats = {};
            let totalBebidasUnidades = 0;
            let totalBebidasMonto = 0;

            completedCarta.forEach(o => {
                if (o.drinks && Array.isArray(o.drinks)) {
                    o.drinks.forEach(d => {
                        const q = Number(d.qty) || 1;
                        const p = Number(d.price) || (Number(prices.drinks?.[d.name]) || 0);
                        if (!bebidasStats[d.name]) {
                            bebidasStats[d.name] = { qty: 0, total: 0, unitPrice: p };
                        }
                        bebidasStats[d.name].qty += q;
                        bebidasStats[d.name].total += (q * p);
                        totalBebidasUnidades += q;
                        totalBebidasMonto += (q * p);
                    });
                }
            });

            // Desglose de Pizzas por Gusto
            const pizzaFlavorsStats = {};
            let totalPizzasEnteras = 0;
            let totalPizzasMedias = 0;

            completedCarta.forEach(o => {
                if (o.pizzas && Array.isArray(o.pizzas)) {
                    o.pizzas.forEach(p => {
                        const q = Number(p.qty) || 1;
                        if (p.type === 'mitad') {
                            totalPizzasMedias += q;
                        } else {
                            totalPizzasEnteras += q;
                        }

                        if (p.flavors && Array.isArray(p.flavors) && p.flavors.length > 0) {
                            p.flavors.forEach(f => {
                                pizzaFlavorsStats[f] = (pizzaFlavorsStats[f] || 0) + (q / p.flavors.length);
                            });
                        } else {
                            pizzaFlavorsStats[p.description] = (pizzaFlavorsStats[p.description] || 0) + q;
                        }
                    });
                }
            });

            const displayDateFormatted = useMemo(() => {
                if (selectedDate === 'all') return 'Todas las fechas registradas';
                const parts = selectedDate.split('-');
                if (parts.length === 3) {
                    return `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
                return selectedDate;
            }, [selectedDate]);

            // Guardar directamente como archivo PDF
            const handleSavePDF = async () => {
                setIsSaving(true);
                setSaveStatus(null);
                const filenameDate = selectedDate === 'all' ? 'Historico_Completo' : selectedDate;
                const defaultFilename = `Reporte_Ganancias_${filenameDate}.pdf`;

                try {
                    const res = await storage.savePDF({ defaultFilename });
                    if (res && res.success) {
                        setSaveStatus({ success: true, msg: `PDF guardado exitosamente en: ${res.filePath}` });
                    } else if (res && res.canceled) {
                        setSaveStatus(null);
                    } else if (res && res.error) {
                        setSaveStatus({ success: false, msg: `Error: ${res.error}` });
                    }
                } catch (err) {
                    console.error("Error al exportar PDF:", err);
                    setSaveStatus({ success: false, msg: `Error al generar PDF: ${err.message || err}` });
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/85 z-[9990] flex flex-col items-center justify-start p-2 sm:p-4 overflow-y-auto">
                    {/* BARRA SUPERIOR DE CONTROL */}
                    <div className="sticky top-2 z-[9999] w-full max-w-[210mm] bg-slate-800 border border-slate-700 shadow-2xl rounded-2xl p-3 mb-3 flex flex-wrap items-center justify-between gap-3 text-white no-print">
                        {/* SELECTOR DE FECHA */}
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-xs font-bold text-gray-300 flex items-center gap-1.5 uppercase tracking-wide">
                                <Calendar size={16} className="text-yellow-400" /> Fecha:
                            </span>
                            <input
                                type="date"
                                value={selectedDate === 'all' ? '' : selectedDate}
                                onChange={e => setSelectedDate(e.target.value || todayStr)}
                                className="bg-slate-900 border border-slate-600 rounded-lg px-2.5 py-1 text-sm font-bold text-white focus:outline-none focus:border-yellow-400"
                            />
                            <button
                                onClick={() => setSelectedDate(todayStr)}
                                className={`text-xs px-2.5 py-1 rounded-md font-bold transition ${selectedDate === todayStr ? 'bg-yellow-400 text-slate-900' : 'bg-slate-700 hover:bg-slate-600 text-gray-200'}`}
                            >
                                Hoy
                            </button>
                            <button
                                onClick={() => {
                                    const y = new Date();
                                    y.setDate(y.getDate() - 1);
                                    setSelectedDate(getLocalDateString(y));
                                }}
                                className={`text-xs px-2.5 py-1 rounded-md font-bold transition ${selectedDate !== todayStr && selectedDate !== 'all' ? 'bg-yellow-400 text-slate-900' : 'bg-slate-700 hover:bg-slate-600 text-gray-200'}`}
                            >
                                Ayer
                            </button>
                            <button

                    </div>

                    <button onClick={handleClear} disabled={cleared} className={`absolute bottom-8 right-8 flex items-center gap-2 px-6 py-3 rounded-lg font-bold shadow-lg transition ${cleared ? 'bg-green-600 text-white' : 'bg-red-600/80 hover:bg-red-600 text-white'}`}>
                        {cleared ? <Check size={24} /> : <Trash2 size={24} />}
                        {cleared ? 'CAJA CERRADA' : 'CERRAR CAJA'}
                    </button>
                </div>
            );
        };

        // --- PANTALLA DE RECEPCIÓN ---
        const ReceptionView = ({ setView, orders, setOrders, activeLibres, setActiveLibres, prices, setPrices, history, setHistory, showConfirm, showAlert, onOpenReport }) => {
            const [showPriceConfig, setShowPriceConfig] = useState(false);
            const [localPrices, setLocalPrices] = useState(prices);
            const [newFlavorName, setNewFlavorName] = useState('');
            const [newDrinkName, setNewDrinkName] = useState('');
            const [newDrinkPrice, setNewDrinkPrice] = useState('');
            const [isLibre, setIsLibre] = useState(false);
            const [currentPizzas, setCurrentPizzas] = useState([]);
            const [currentDrinks, setCurrentDrinks] = useState([]);
            const [withBox, setWithBox] = useState(false);
            const [empQtyInput, setEmpQtyInput] = useState('');
            const [peopleQtyInput, setPeopleQtyInput] = useState('');

            const clientNameRef = useRef(null);
            const peopleQtyRef = useRef(null);
            const libreObsRef = useRef(null);
            const empanadasRef = useRef(null);
            const obsRef = useRef(null);
            const pizzaQtyRef = useRef(null);
            const drinkSelectRef = useRef(null);
            const drinkQtyRef = useRef(null);

            const [selectedFlavors, setSelectedFlavors] = useState([]);
            const [pizzaTypeUI, setPizzaTypeUI] = useState('entera');
            const pizzaFlavors = Object.keys(prices.flavors || {});

            const getFlavorMediaPrice = useCallback((flavor) => {
                const p = prices.flavors?.[flavor];
                if (!p) return 0;
                const media = parseInt(p.media, 10);
                if (!isNaN(media) && media > 0) return media;
                const entera = parseInt(p.entera, 10) || 0;
                return Math.round(entera / 2);
            }, [prices.flavors]);

            const getFlavorEnteraPrice = useCallback((flavor) => {
                const p = prices.flavors?.[flavor];
                if (!p) return 0;
                const entera = parseInt(p.entera, 10);
                if (!isNaN(entera) && entera > 0) return entera;
                const media = parseInt(p.media, 10) || 0;
                return media * 2;
            }, [prices.flavors]);

            const getPizzaPrice = useCallback((type, flavors) => {
                if (!flavors || flavors.length === 0) return 0;

                if (flavors.length === 1) {
                    return type === 'mitad' ? getFlavorMediaPrice(flavors[0]) : getFlavorEnteraPrice(flavors[0]);
                }

                if (flavors.length === 2) {
                    const m1 = getFlavorMediaPrice(flavors[0]);
                    const m2 = getFlavorMediaPrice(flavors[1]);
                    const sumMedias = m1 + m2;
                    return type === 'mitad' ? Math.round(sumMedias / 2) : sumMedias;
                }

                if (flavors.length === 3) {
                    const e1 = getFlavorEnteraPrice(flavors[0]);
                    const e2 = getFlavorEnteraPrice(flavors[1]);
                    const e3 = getFlavorEnteraPrice(flavors[2]);
                    const avgEntera = Math.round((e1 + e2 + e3) / 3);
                    return type === 'mitad' ? Math.round(avgEntera / 2) : avgEntera;
                }

                return 0;
            }, [getFlavorMediaPrice, getFlavorEnteraPrice]);

            const calculatedTotal = useMemo(() => {
                if (isLibre) {
                    const people = parseInt(peopleQtyInput, 10) || 0;
                    const librePrice = parseInt(prices.pizzaLibreH, 10) || 0;
                    return people * librePrice;
                }
                const pizzasSum = currentPizzas.reduce((sum, p) => sum + (Number(p.price) || 0) * (Number(p.qty) || 1), 0);
                const drinksSum = currentDrinks.reduce((sum, d) => sum + (Number(d.price) || 0) * (Number(d.qty) || 1), 0);
                const empQty = parseInt(empQtyInput, 10) || 0;
                const empSum = empQty * (Number(prices.empanada) || 0);
                return pizzasSum + drinksSum + empSum;
            }, [isLibre, peopleQtyInput, prices.pizzaLibreH, prices.empanada, currentPizzas, currentDrinks, empQtyInput]);

            const handleFlavorClick = (flavor) => {
                const idx = selectedFlavors.indexOf(flavor);
                if (idx !== -1) {
                    setSelectedFlavors(selectedFlavors.filter(f => f !== flavor));
                } else {
                    if (selectedFlavors.length < 3) {
                        setSelectedFlavors([...selectedFlavors, flavor]);
                    } else {
                        showAlert("Máximo 3 gustos por pizza");
                    }
                }
            };

            const addPizza = () => {
                if (selectedFlavors.length === 0) return showAlert("Seleccioná al menos un gusto");

                const qty = parseInt(pizzaQtyRef.current?.value, 10) || 1;
                const obs = obsRef.current?.value || "";
                const type = pizzaTypeUI;

                let flavorText = "";
                if (selectedFlavors.length === 1) {
                    flavorText = selectedFlavors[0];
                } else if (selectedFlavors.length === 2) {
                    flavorText = selectedFlavors.join(' y ');
                } else {
                    flavorText = `${selectedFlavors.slice(0, -1).join(', ')} y ${selectedFlavors[selectedFlavors.length - 1]}`;
                }

                let desc = type === 'mitad' ? `Media ${flavorText}` : flavorText;

                const unitPrice = getPizzaPrice(type, selectedFlavors);
                const boxPrice = withBox ? (parseInt(prices.box, 10) || 0) : 0;
                const totalUnitPrice = unitPrice + boxPrice;

                setCurrentPizzas([
                    ...currentPizzas,
                    {
                        id: Date.now(),
                        description: desc,
                        qty,
                        type,
                        flavors: [...selectedFlavors],
                        price: totalUnitPrice,
                        unitPrice,
                        boxPrice,
                        obs,
                        withBox
                    }
                ]);

                setSelectedFlavors([]);
                if (obsRef.current) obsRef.current.value = "";
                if (pizzaQtyRef.current) pizzaQtyRef.current.value = 1;
                setPizzaTypeUI('entera');
                setWithBox(false);
            };

            const addDrinkQuick = (drinkName) => {
                const price = parseInt(prices.drinks[drinkName], 10) || 0;
                const existingIndex = currentDrinks.findIndex(d => d.name === drinkName);
                if (existingIndex !== -1) {
                    const updated = [...currentDrinks];
                    updated[existingIndex].qty += 1;
                    setCurrentDrinks(updated);
                } else {
                    setCurrentDrinks([...currentDrinks, { id: Date.now(), name: drinkName, qty: 1, price }]);
                }
            };

            const submitOrder = () => {
                const client = clientNameRef.current.value.trim();
                if (!client) return showAlert("Falta nombre");

                const newId = Date.now();
                const currentDateStr = getLocalDateString(new Date());

                if (isLibre) {
                    const people = parseInt(peopleQtyRef.current.value, 10) || 0;
                    const obs = libreObsRef.current.value;
                    if (!people || people <= 0) return showAlert("Falta cantidad de personas");

                    const pricePerPerson = parseInt(prices.pizzaLibreH, 10) || 0;
                    const tableTotal = people * pricePerPerson;

                    const newLibre = {
                        id: newId,
                        client,
                        people,
                        pricePerPerson,
                        totalPrice: tableTotal,
                        round: 1,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        date: currentDateStr,
                        obs
                    };

                    setActiveLibres([...activeLibres, newLibre]);

                    setOrders([...orders, {
                        id: newId + '_1',
                        libreId: newId,
                        client,
                        type: 'libre',
                        people,
                        round: 1,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        date: currentDateStr,
                        obs,
                        pizzas: [],
                        drinks: [],
                        empanadas: 0,
                        totalPrice: 0
                    }]);

                    peopleQtyRef.current.value = "";
                    libreObsRef.current.value = "";
                    setPeopleQtyInput('');
                } else {
                    const empQty = parseInt(empanadasRef.current.value, 10) || 0;
                    if (currentPizzas.length === 0 && empQty === 0 && currentDrinks.length === 0) return showAlert("Pedido vacío");

                    const pizzasTotal = currentPizzas.reduce((sum, p) => sum + (Number(p.price) * Number(p.qty)), 0);
                    const drinksTotal = currentDrinks.reduce((sum, d) => sum + (Number(d.price) * Number(d.qty)), 0);
                    const empTotal = empQty * (parseInt(prices.empanada, 10) || 0);
                    const total = pizzasTotal + drinksTotal + empTotal;

                    setOrders([...orders, {
                        id: newId,
                        client,
                        pizzas: currentPizzas,
                        drinks: currentDrinks,
                        empanadas: empQty,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        date: currentDateStr,
                        type: 'normal',
                        totalPrice: total
                    }]);

                    setCurrentPizzas([]);
                    setCurrentDrinks([]);
                    empanadasRef.current.value = "";
                    setEmpQtyInput('');
                }
                clientNameRef.current.value = "";
                clientNameRef.current.focus();
            };

            const handleRound = useCallback((l) => {
                const nr = l.round + 1;
                const updated = activeLibres.map(x => x.id === l.id ? { ...x, round: nr } : x);
                setActiveLibres(updated);
                setOrders([...orders, {
                    id: Date.now(),
                    libreId: l.id,
                    client: l.client,
                    pizzas: [],
                    drinks: [],
                    empanadas: 0,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    date: getLocalDateString(new Date()),
                    type: 'libre',
                    people: l.people,
                    round: nr,
                    totalPrice: 0,
                    obs: l.obs
                }]);
            }, [activeLibres, orders, setActiveLibres, setOrders]);

            const handleCloseLibre = useCallback((l) => {
                const people = parseInt(l.people, 10) || 0;
                const pricePerPerson = parseInt(prices.pizzaLibreH, 10) || 0;
                const totalTable = people * pricePerPerson;
                const currentDateStr = getLocalDateString(new Date());

                showConfirm(`¿Cerrar Mesa Libre de ${l.client} (${people} personas - Total: $${totalTable.toLocaleString()})?\nEsto la sumará al reporte y balance de ganancias.`, () => {
                    const closedEntry = {
                        id: l.id,
                        client: l.client,
                        type: 'libre',
                        people,
                        pricePerPerson,
                        totalPrice: totalTable,
                        round: l.round,
                        timestamp: l.timestamp,
                        date: l.date || currentDateStr,
                        closedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        completedAt: new Date().toISOString(),
                        obs: l.obs || ''
                    };

                    setHistory([...history, closedEntry]);
                    setActiveLibres(activeLibres.filter(x => x.id !== l.id));
                    setOrders(orders.filter(x => x.libreId !== l.id));
                });
            }, [activeLibres, orders, history, prices.pizzaLibreH, setActiveLibres, setOrders, setHistory, showConfirm]);

            const handleDeleteOrder = useCallback((o) => {
                showConfirm('¿Eliminar sin sumar al total?', () => {
                    setOrders(orders.filter(x => x.id !== o.id));
                });
            }, [orders, setOrders, showConfirm]);

            const handleCompleteOrder = useCallback((o) => {
                if (o.type === 'libre') {
                    setOrders(orders.filter(x => x.id !== o.id));
                    return;
                }
                showConfirm(`¿Marcar como completado? Esto sumará $${(o.totalPrice || 0).toLocaleString()} al total registrado.`, () => {
                    setHistory([...history, { ...o, date: o.date || getLocalDateString(new Date()), completedAt: new Date().toISOString() }]);
                    setOrders(orders.filter(x => x.id !== o.id));
                });
            }, [history, orders, setHistory, setOrders, showConfirm]);

            return (
                <div className="flex h-screen overflow-hidden relative bg-gray-100 text-gray-900">
                    {/* MODAL CONFIG PRECIOS */}
                    {showPriceConfig && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl max-w-xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                                <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 shrink-0">
                                    <h2 className="text-xl font-bold flex items-center gap-2 text-gray-800"><Settings /> Configuración de Precios</h2>
                                    <button onClick={() => setShowPriceConfig(false)} className="text-gray-400 hover:text-gray-700 p-1 rounded hover:bg-gray-200"><X size={22} /></button>
                                </div>

                                <div className="p-4 overflow-y-auto flex-1 space-y-4">
                                    <div className="bg-blue-50 p-3 rounded border border-blue-200">
                                        <label className="font-bold text-blue-800 block mb-1 flex items-center gap-2"><PackageIcon size={16} /> Precio de la Caja (por pizza)</label>
                                        <input type="number" key={`box-${showPriceConfig}`} defaultValue={localPrices.box || 0} onChange={e => setLocalPrices({ ...localPrices, box: parseInt(e.target.value, 10) || 0 })} className="w-full p-2 border border-blue-300 rounded font-bold text-lg" />
                                    </div>
                                    <div className="bg-yellow-50 p-3 rounded border border-yellow-200">
                                        <label className="font-bold text-yellow-800 block mb-1">Precio Empanada Unitaria</label>
                                        <input type="number" key={`emp-${showPriceConfig}`} defaultValue={localPrices.empanada || 0} onChange={e => setLocalPrices({ ...localPrices, empanada: parseInt(e.target.value, 10) || 0 })} className="w-full p-2 border border-yellow-300 rounded font-bold text-lg" />
                                    </div>
                                    <div className="bg-purple-50 p-3 rounded border border-purple-200">
                                        <label className="font-bold text-purple-800 block mb-1 flex items-center gap-2"><Users size={16} /> Precio Mesa Libre (por persona)</label>
                                        <input type="number" key={`libre-${showPriceConfig}`} defaultValue={localPrices.pizzaLibreH || 0} onChange={e => setLocalPrices({ ...localPrices, pizzaLibreH: parseInt(e.target.value, 10) || 0 })} className="w-full p-2 border border-purple-300 rounded font-bold text-lg" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold border-b pb-2 text-orange-800 flex items-center gap-2"><Pizza size={16} /> Pizzas (Entera / Media)</h3>
                                        <div className="space-y-2 mt-2">
                                            {Object.keys(localPrices.flavors || {}).map(f => (
                                                <div key={f} className="flex gap-2 items-center bg-gray-50 p-2 rounded border border-gray-200">
                                                    <div className="flex-1 font-bold text-sm text-gray-700">{f}</div>
                                                    <input type="number" placeholder="Entera" defaultValue={localPrices.flavors[f]?.entera} onChange={e => setLocalPrices({ ...localPrices, flavors: { ...localPrices.flavors, [f]: { ...localPrices.flavors[f], entera: parseInt(e.target.value, 10) || 0 } } })} className="w-24 p-1.5 border rounded text-center font-bold" />
                                                    <input type="number" placeholder="Media" defaultValue={localPrices.flavors[f]?.media} onChange={e => setLocalPrices({ ...localPrices, flavors: { ...localPrices.flavors, [f]: { ...localPrices.flavors[f], media: parseInt(e.target.value, 10) || 0 } } })} className="w-24 p-1.5 border rounded text-center font-bold" />
                                                    <button onClick={() => { const { [f]: _, ...rest } = localPrices.flavors; setLocalPrices({ ...localPrices, flavors: rest }); }} className="text-red-400 hover:text-red-600 ml-1"><Trash2 size={16} /></button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2 mt-2">
                                            <input type="text" value={newFlavorName} onChange={e => setNewFlavorName(e.target.value)} placeholder="Nuevo gusto..." className="flex-1 p-2 border rounded text-sm" />
                                            <button onClick={() => { if (newFlavorName.trim()) { setLocalPrices({ ...localPrices, flavors: { ...localPrices.flavors, [newFlavorName.trim()]: { entera: 0, media: 0 } } }); setNewFlavorName(''); } }} className="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 rounded font-bold text-sm">+ Agregar</button>
                                        </div>
                                    </div>
                                    <div>
                                        <h3 className="font-bold border-b pb-2 text-blue-800 flex items-center gap-2"><CupSoda size={16} /> Bebidas</h3>
                                        <div className="space-y-2 mt-2">
                                            {Object.entries(localPrices.drinks || {}).map(([name, price]) => (
                                                <div key={name} className="flex gap-2 items-center bg-gray-50 p-2 rounded border border-gray-200">
                                                    <div className="flex-1 font-bold text-sm text-gray-700">{name}</div>
                                                    <input type="number" defaultValue={price} onChange={e => setLocalPrices({ ...localPrices, drinks: { ...localPrices.drinks, [name]: parseInt(e.target.value, 10) || 0 } })} className="w-24 p-1.5 border rounded text-center font-bold" />
                                                    <button onClick={() => { const { [name]: _, ...rest } = localPrices.drinks; setLocalPrices({ ...localPrices, drinks: rest }); }} className="text-red-400 hover:text-red-600 ml-1"><Trash2 size={16} /></button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2 mt-2">
                                            <input type="text" value={newDrinkName} onChange={e => setNewDrinkName(e.target.value)} placeholder="Nombre bebida..." className="flex-1 p-2 border rounded text-sm" />
                                            <input type="number" value={newDrinkPrice} onChange={e => setNewDrinkPrice(e.target.value)} placeholder="Precio" className="w-24 p-2 border rounded text-sm text-center" />
                                            <button onClick={() => { if (newDrinkName.trim()) { setLocalPrices({ ...localPrices, drinks: { ...(localPrices.drinks || {}), [newDrinkName.trim()]: parseInt(newDrinkPrice, 10) || 0 } }); setNewDrinkName(''); setNewDrinkPrice(''); } }} className="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded font-bold text-sm">+ Agregar</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 border-t border-gray-200 bg-gray-50 shrink-0 shadow-md">
                                    <button onClick={() => { setPrices(localPrices); setShowPriceConfig(false); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold text-lg shadow transition">GUARDAR Y CERRAR</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="w-1/2 bg-gray-50 flex flex-col border-r border-gray-300 shadow-xl z-10 h-full">
                        {/* HEADER DE RECEPCIÓN */}
                        <div className="bg-gray-800 p-2 flex justify-between items-center text-white shrink-0 h-12">
                            <div className="flex gap-2 items-center">
                                <button onClick={() => setView('landing')} className="text-xs bg-gray-700 hover:bg-gray-600 px-2.5 py-1 rounded font-bold">SALIR</button>
                                <span className="font-bold text-sm flex items-center gap-1.5"><User size={16} className="text-blue-400" /> RECEPCIÓN</span>
                            </div>
                            <div className="flex gap-2 items-center">
                                <button
                                    onClick={onOpenReport}
                                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded-md font-bold flex items-center gap-1 shadow transition"
                                    title="Ver y Exportar Reporte de Caja en PDF"
                                >
                                    <FileText size={14} /> REPORTE PDF
                                </button>
                                <button onClick={() => { setLocalPrices(prices); setShowPriceConfig(true); }} className="text-gray-300 hover:text-white p-1 rounded hover:bg-gray-700" title="Configurar Precios">
                                    <Settings size={18} />
                                </button>
                            </div>
                        </div>

                        {/* INPUT CLIENTE / MESA */}
                        <div className="bg-white p-3 border-b border-gray-200 shrink-0 shadow-sm z-20 space-y-3">
                            <div className="flex gap-2 items-start">
                                <div className="flex-1 bg-white rounded shadow-sm border border-gray-200 p-2">
                                    <label className="block text-[10px] font-bold text-gray-400 uppercase">Nombre Cliente / Mesa</label>
                                    <input ref={clientNameRef} type="text" className="w-full text-xl font-bold text-gray-800 p-1 border-b-2 border-gray-300 outline-none bg-transparent" placeholder="Ej: Mesa 4 / Juan" autoFocus />
                                </div>
                                <button onClick={() => setIsLibre(!isLibre)} className={`flex flex-col items-center justify-center px-4 py-2 rounded border h-full transition ${isLibre ? 'bg-purple-100 border-purple-500 text-purple-700 shadow-sm' : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50'}`}>
                                    <span className="text-xs font-black">{isLibre ? 'MESA LIBRE' : 'A LA CARTA'}</span>
                                    <Users size={20} />
                                </button>
                            </div>

                            {isLibre && (
                                <div className="mt-2 space-y-3">
                                    <div className="flex gap-2">
                                        <div className="relative">
                                            <input ref={peopleQtyRef} type="number" placeholder="Cant. Personas" value={peopleQtyInput} onChange={e => setPeopleQtyInput(e.target.value)} className="w-36 p-2 border-2 border-purple-400 rounded text-center font-bold text-lg" />
                                            <span className="text-[10px] font-bold text-purple-700 block text-center mt-0.5">(${prices.pizzaLibreH || 0} c/u)</span>
                                        </div>
                                        <input ref={libreObsRef} type="text" placeholder="Observación Mesa (mozo, ubicación, etc)..." className="flex-1 p-2 border-2 border-purple-400 rounded h-[46px]" />
                                    </div>
                                    
                                    <div className="bg-slate-200 border-2 border-purple-300 rounded-lg p-2 flex flex-col h-[52vh]">
                                        <div className="bg-purple-200 text-purple-900 px-3 py-1.5 rounded text-xs font-black uppercase flex justify-between items-center mb-2">
                                            <span className="flex items-center gap-1.5"><Users size={15} /> Mesas Libres Activas</span>
                                            <span className="bg-purple-700 text-white px-2 py-0.5 rounded-full text-[11px]">{activeLibres.length}</span>
                                        </div>
                                        <ActiveLibresList libres={activeLibres} onRound={handleRound} onClose={handleCloseLibre} />
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* PANEL CARTA */}
                        {!isLibre && (
                            <div className="flex-1 flex flex-col min-h-0 bg-gray-100 relative">
                                <div className="p-2.5 space-y-2.5 shrink-0 border-b border-gray-200 bg-gray-50 shadow-md z-10">
                                    <div className="bg-orange-50 p-2.5 rounded-lg border border-orange-200 shadow-sm space-y-2">
                                        <div className="flex justify-between items-center">
                                            <div className="flex items-center gap-2">
                                                <h3 className="font-bold text-orange-900 flex items-center gap-1.5 text-sm">
                                                    <Pizza size={18} className="text-orange-600" /> Gustos de Pizza (1, 2 o 3 gustos)
                                                </h3>
                                                {selectedFlavors.length > 0 && (
                                                    <button onClick={() => setSelectedFlavors([])} className="text-xs text-orange-600 hover:text-orange-800 underline font-semibold">
                                                        Limpiar ({selectedFlavors.length})
                                                    </button>
                                                )}
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <label className={`flex items-center gap-1.5 cursor-pointer px-2 py-1 rounded border text-xs font-bold transition ${withBox ? 'bg-blue-100 border-blue-400 text-blue-700' : 'bg-white border-gray-300 text-gray-600'}`}>
                                                    <input type="checkbox" checked={withBox} onChange={e => setWithBox(e.target.checked)} className="w-3.5 h-3.5" />
                                                    <PackageIcon size={13} /> Caja (+${prices.box || 0})
                                                </label>
                                                <div className="flex bg-white rounded border border-gray-300 overflow-hidden text-xs shadow-sm">
                                                    <button onClick={() => setPizzaTypeUI('entera')} className={`px-2.5 py-1 font-bold transition ${pizzaTypeUI === 'entera' ? 'bg-orange-500 text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Entera</button>
                                                    <button onClick={() => setPizzaTypeUI('mitad')} className={`px-2.5 py-1 font-bold transition ${pizzaTypeUI === 'mitad' ? 'bg-orange-500 text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Media</button>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-3 sm:grid-cols-4 gap-1.5 p-1 bg-white/60 rounded border border-orange-100 max-h-[140px] overflow-y-auto">

                                                            isSelected

                                                        }`}

                                                            <span className="absolute -top-1.5 -right-1.5 bg-yellow-400 text-orange-950 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow border border-orange-600">
                                                                {idx + 1}º
                                                            </span>
                                                        )}
                                                        <span className="truncate w-full">{f}</span>
                                                    </button>
                                                );

                                        </div>

                                        <div className="flex gap-2 items-center pt-1 border-t border-orange-200/60">
                                            <div className="flex-1 bg-white px-2.5 py-1.5 rounded border border-orange-200 text-xs truncate">
                                                {selectedFlavors.length === 0 ? (
                                                    <span className="text-gray-400 italic">👉 Tocá 1, 2 o 3 gustos para armar la pizza</span>
                                                ) : (
                                                    <span className="font-bold text-orange-900">
                                                        🍕 {pizzaTypeUI === 'mitad' ? 'Media ' : ''}
                                                        {selectedFlavors.length === 1 ? selectedFlavors[0] : (selectedFlavors.length === 2 ? selectedFlavors.join(' y ') : `${selectedFlavors.slice(0, -1).join(', ')} y ${selectedFlavors[selectedFlavors.length - 1]}`)}
                                                        <span className="text-green-700 ml-1">(${getPizzaPrice(pizzaTypeUI, selectedFlavors) + (withBox ? (parseInt(prices.box, 10) || 0) : 0)})</span>
                                                    </span>
                                                )}
                                            </div>
                                            <input ref={obsRef} type="text" placeholder="Obs..." className="w-24 p-1.5 border rounded text-xs bg-white" />
                                            <div className="flex items-center gap-1">
                                                <input ref={pizzaQtyRef} type="number" min="1" defaultValue="1" className="w-12 p-1.5 border rounded text-center font-bold text-xs" />
                                                <button 
                                                    onClick={addPizza} 
                                                    disabled={selectedFlavors.length === 0}
                                                    className={`px-3 py-1.5 rounded font-bold text-xs uppercase shadow transition ${selectedFlavors.length > 0 ? 'bg-orange-600 hover:bg-orange-700 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                                                >
                                                    + AGREGAR
                                                </button>
                                            </div>
                                        </div>

                                    <div className="flex gap-2 items-stretch">
                                        <div className="flex-[0.7] bg-yellow-50 p-2 rounded-lg border border-yellow-200 flex flex-col justify-center shadow-sm">
                                            <div className="flex items-center justify-center gap-1 mb-1"><Utensils size={14} className="text-yellow-700" /><span className="font-bold text-yellow-800 text-xs text-center leading-tight">Empanadas<br/>(${prices.empanada || 0})</span></div>
                                            <input ref={empanadasRef} type="number" placeholder="0" value={empQtyInput} onChange={e => setEmpQtyInput(e.target.value)} className="w-full p-1.5 border border-yellow-300 rounded font-bold text-center text-lg" />
                                        </div>

                                        <div className="flex-[1.3] bg-blue-50 p-2 rounded-lg border border-blue-200 shadow-sm flex flex-col justify-between">
                                            <div className="flex justify-between items-center mb-1">
                                                <h3 className="font-bold text-blue-900 flex items-center gap-1 text-xs"><CupSoda size={14} className="text-blue-600" /> Bebidas Rápidas</h3>
                                                <span className="text-[10px] text-blue-600 font-semibold">Tap = +1</span>
                                            </div>
                                            {Object.keys(prices.drinks || {}).length === 0 ? (
                                                <div className="text-xs text-gray-400 italic text-center py-2">Sin bebidas cargadas</div>
                                            ) : (
                                                <div className="grid grid-cols-2 gap-1.5 p-0.5 max-h-[75px] overflow-y-auto">
                                                    {Object.entries(prices.drinks || {}).map(([dName, dPrice]) => (
                                                        <button
                                                            key={dName}
                                                            type="button"
                                                            onClick={() => addDrinkQuick(dName)}
                                                            className="bg-white hover:bg-blue-100 text-blue-900 border border-blue-300 hover:border-blue-400 p-1.5 rounded text-xs font-bold shadow-sm active:scale-95 transition flex justify-between items-center text-left"
                                                        >
                                                            <span className="truncate mr-1">{dName}</span>
                                                            <span className="text-[10px] bg-blue-100 text-blue-800 px-1 py-0.5 rounded font-black shrink-0">${dPrice}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto p-2 space-y-1 bg-gray-100">
                                    {currentPizzas.map((p) => (
                                        <div key={p.id} className="bg-white p-2 rounded border flex justify-between items-center shadow-sm text-sm">
                                            <div>
                                                <span className="font-bold text-gray-800 mr-1">{p.qty}x</span> {p.description} 
                                                {p.withBox && <span className="text-blue-600 font-bold text-xs ml-1">📦</span>}

                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs font-bold bg-green-50 text-green-700 px-1.5 py-0.5 rounded border border-green-200">
                                                    ${((p.price || 0) * (p.qty || 1)).toLocaleString()}
                                                </span>
                                                <button onClick={() => setCurrentPizzas(currentPizzas.filter(x => x.id !== p.id))} className="text-red-400 hover:text-red-600"><Trash2 size={16} /></button>
                                            </div>
                                        </div>

                                        <div key={d.id} className="bg-white p-2 rounded border flex justify-between items-center shadow-sm text-sm">
                                            <div><span className="font-bold text-blue-800 mr-1">{d.qty}x</span> {d.name} <span className="text-xs text-blue-600 font-bold">🥤</span></div>

                                                <span className="text-xs font-bold bg-green-50 text-green-700 px-1.5 py-0.5 rounded border border-green-200">
                                                    ${((d.price || 0) * (d.qty || 1)).toLocaleString()}
                                                </span>
                                                <button onClick={() => setCurrentDrinks(currentDrinks.filter(x => x.id !== d.id))} className="text-red-400 hover:text-red-600"><Trash2 size={16} /></button>
                                            </div>
                                        </div>
                                    ))}

                            </div>
                        )}

                        {/* TOTAL Y ENVIAR */}
                        <div className="p-3 bg-white border-t border-gray-200 shrink-0 z-20 shadow-lg flex flex-col gap-2">
                            <div className={`flex justify-between items-center px-4 py-2.5 rounded-xl border shadow-sm ${isLibre ? 'bg-purple-50 border-purple-200' : 'bg-emerald-50 border-emerald-200'}`}>
                                <span className={`font-black text-sm uppercase tracking-wide flex items-center gap-1.5 ${isLibre ? 'text-purple-800' : 'text-emerald-800'}`}>

                                <span className={`text-3xl font-black tracking-tight ${isLibre ? 'text-purple-700' : 'text-emerald-600'}`}>
                                    ${calculatedTotal.toLocaleString()}
                                </span>

                            <button onClick={submitOrder} className={`w-full py-3 rounded-lg font-bold text-xl text-white shadow transition ${isLibre ? 'bg-purple-600 hover:bg-purple-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {isLibre ? 'INICIAR MESA LIBRE' : 'ENVIAR PEDIDO'}
                            </button>
                        </div>
                    </div>

                    {/* COLUMNA DERECHA */}
                    <div className="w-1/2 bg-slate-100 flex flex-col h-full overflow-hidden border-l border-gray-300">
                        <div className="p-3 bg-slate-800 text-white shadow-md flex justify-between items-center shrink-0">
                            <h2 className="font-bold flex items-center gap-2 text-sm"><Monitor size={18} /> Pedidos en Cocina</h2>
                            <span className="text-xs bg-slate-700 px-2 py-0.5 rounded-full font-bold">{orders.length}</span>
                        </div>
                        
                        <KitchenOrdersList orders={orders} onComplete={handleCompleteOrder} onDelete={handleDeleteOrder} prices={prices} />

                        <div className="bg-slate-200 border-t-4 border-slate-300 shrink-0 h-[32vh] flex flex-col shadow-inner">
                            <div className="bg-slate-300 px-3 py-2 text-xs font-bold text-slate-800 uppercase flex justify-between items-center border-b border-slate-400/50">
                                <span className="flex items-center gap-1.5"><Users size={16} className="text-purple-600" /> Mesas Libres Activas</span>
                                <span className="bg-purple-600 text-white px-2.5 py-0.5 rounded-full font-black text-xs">{activeLibres.length}</span>
                            </div>
                            <ActiveLibresList libres={activeLibres} onRound={handleRound} onClose={handleCloseLibre} />
