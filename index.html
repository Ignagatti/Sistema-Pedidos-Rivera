        };

        // --- PANTALLA DE COCINA ---
        const KitchenView = ({ setView, orders, setOrders, history, setHistory, showConfirm, showAlert, prices, activeLibres, onOpenReport }) => {
            const [zoom, setZoom] = useState(1);
            const [showTotal, setShowTotal] = useState(false);

            const handleComplete = (o) => {
                if (o.type === 'libre') {
                    setOrders(orders.filter(x => x.id !== o.id));
                    return;
                }
                showConfirm(`¿Marcar como completado? Esto sumará $${(o.totalPrice || 0).toLocaleString()} al total registrado.`, () => {
                    setHistory([...history, { ...o, date: o.date || getLocalDateString(new Date()), completedAt: new Date().toISOString() }]);
                    setOrders(orders.filter(x => x.id !== o.id));
                });
            };

            const todayStr = useMemo(() => getLocalDateString(new Date()), []);
            const totalCartaHoy = useMemo(() => history.filter(o => o.type !== 'libre' && (o.date === todayStr || (o.completedAt && o.completedAt.startsWith(todayStr)) || !o.completedAt)).reduce((sum, o) => sum + (Number(o.totalPrice) || 0), 0), [history, todayStr]);
            const totalLibresCerradasHoy = useMemo(() => history.filter(o => o.type === 'libre' && (o.date === todayStr || (o.completedAt && o.completedAt.startsWith(todayStr)) || !o.completedAt)).reduce((sum, o) => sum + (Number(o.totalPrice) || ((Number(o.people) || 0) * (Number(prices.pizzaLibreH) || 0))), 0), [history, todayStr, prices.pizzaLibreH]);
            const totalLibresActivas = useMemo(() => (activeLibres || []).reduce((sum, l) => sum + ((Number(l.people) || 0) * (Number(prices.pizzaLibreH) || 0)), 0), [activeLibres, prices.pizzaLibreH]);
            const granTotalHoy = totalCartaHoy + totalLibresCerradasHoy + totalLibresActivas;

            return (
                <div className="bg-black min-h-screen text-white flex flex-col overflow-hidden relative">
                    {/* MODAL RESUMEN RÁPIDO */}
                    {showTotal && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="bg-white text-black p-6 rounded-2xl max-w-md w-full shadow-2xl space-y-4">
                                <h2 className="text-xl font-bold flex items-center justify-center gap-2 text-green-700">
                                    <DollarSign size={24} /> Balance del Día
                                </h2>

                                <div className="space-y-2 border-y py-3 text-sm">
                                    <div className="flex justify-between items-center">
                                        <span className="text-gray-600 font-semibold">Total A La Carta:</span>
                                        <span className="font-bold text-gray-900">${totalCartaHoy.toLocaleString()}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-purple-700 font-semibold">Mesas Libres Cerradas:</span>
                                        <span className="font-bold text-purple-800">${totalLibresCerradasHoy.toLocaleString()}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-amber-700 font-semibold">Mesas Libres Activas:</span>
                                        <span className="font-bold text-amber-800">${totalLibresActivas.toLocaleString()}</span>
                                    </div>
                                    <div className="flex justify-between items-center pt-2 border-t font-black text-lg text-emerald-700">
                                        <span>Total General:</span>
                                        <span>${granTotalHoy.toLocaleString()}</span>
                                    </div>
                                </div>

                                <div className="flex gap-2">
                                    <button
                                        onClick={() => { setShowTotal(false); onOpenReport(); }}
                                        className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold flex items-center justify-center gap-1.5 shadow"
                                    >
                                        <Download size={16} /> Ver y Guardar PDF
                                    </button>
                                    <button
                                        onClick={() => setShowTotal(false)}
                                        className="bg-gray-200 hover:bg-gray-300 px-4 py-2.5 rounded-lg font-bold text-gray-700"
                                    >
                                        Cerrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* HEADER DE COCINA */}
                    <div className="bg-red-800 p-3 flex justify-between items-center shadow-lg border-b-4 border-red-900 z-10">
                        <h1 className="text-2xl font-bold uppercase tracking-wider flex items-center gap-3"><ChefHat size={32} /> COCINA</h1>
                        <div className="flex gap-2 items-center">
                            <button onClick={() => setShowTotal(true)} className="bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-white font-bold flex items-center gap-2 shadow">
                                <DollarSign size={20} /> TOTAL (${granTotalHoy.toLocaleString()})
                            </button>
                            <button onClick={onOpenReport} className="bg-emerald-700 hover:bg-emerald-600 px-3 py-2 rounded text-white font-bold flex items-center gap-1.5 shadow text-xs" title="Guardar Reporte en PDF">
                                <FileText size={16} /> REPORTE PDF
                            </button>
                            <button onClick={() => setZoom(z => Math.max(0.6, z - 0.1))} className="bg-white/10 p-2 rounded ml-2 hover:bg-white/20"><ZoomOut size={20} /></button>
                            <button onClick={() => setZoom(z => Math.min(1.6, z + 0.1))} className="bg-white/10 p-2 rounded hover:bg-white/20"><ZoomIn size={20} /></button>
                            <button onClick={() => setView('landing')} className="text-xs ml-4 text-red-300 underline self-center hover:text-white">Salir</button>
                        </div>
                    </div>

                    {/* PEDIDOS EN PANTALLA DE COCINA */}
                    <div className="flex-1 overflow-auto p-4 bg-zinc-900">
                        {orders.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center opacity-30">
                                <ChefHat size={120} />
                                <h2 className="text-4xl font-bold mt-4">Esperando pedidos...</h2>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 items-start content-start" style={{ zoom: zoom }}>
                                {orders.map((o) => (
                                    <div key={o.id} className={`relative rounded-lg overflow-hidden shadow-2xl ${o.type === 'libre' ? 'bg-indigo-900 ring-2 ring-indigo-500' : 'bg-gray-800 ring-1 ring-gray-700'}`}>
                                        <div className={`p-3 flex justify-between items-start border-b border-white/10 ${o.type === 'libre' ? 'bg-indigo-800' : 'bg-gray-700'}`}>
                                            <div className="overflow-hidden">
                                                <h3 className="text-3xl font-black text-yellow-400 truncate leading-none mb-1">{o.client}</h3>
                                                <div className="flex items-center gap-2 text-gray-300 font-mono text-sm">
                                                    <span>{o.timestamp}</span>
                                                    {o.type === 'libre' && <span className="text-indigo-200 font-bold">• MESA LIBRE</span>}
                                                </div>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => handleComplete(o)} className="bg-green-600/50 hover:bg-green-600 text-white px-3 py-2 rounded font-bold flex items-center gap-1" title="Completar">
                                                    <Check size={20} /> Listo
                                                </button>
                                            </div>
                                        </div>
                                        <div className="p-4 space-y-4">
                                            {o.type === 'libre' && (
                                                <div className="bg-indigo-950/50 p-3 rounded border border-indigo-500/50 text-center space-y-2">
                                                    <div className="text-sm text-indigo-300 uppercase font-bold tracking-widest">{o.round === 1 ? 'PRIMER LIBRE' : `${o.round}ª RONDA`}</div>
                                                    <div className="text-5xl font-bold text-white flex items-center justify-center gap-2"><Users size={40} /> {o.people}</div>
                                                </div>
                                            )}
                                            {o.obs && (
                                                <div className="bg-yellow-900/60 p-3 rounded border-l-4 border-yellow-500 flex items-start gap-3">
                                                    <AlertCircle className="text-yellow-400 shrink-0 mt-1" size={24} />
                                                    <span className="text-xl font-bold text-yellow-100 uppercase">{o.obs}</span>
                                                </div>
                                            )}
                                            {o.pizzas && o.pizzas.length > 0 && (
                                                <ul className="space-y-3">
                                                    {o.pizzas.map((p, i) => (
                                                        <li key={i} className="border-b border-white/10 pb-2 last:border-0 last:pb-0">
                                                            <div className="text-2xl font-bold leading-tight">
                                                                <span className="text-green-400 inline-block w-8 text-right mr-2">{p.qty}x</span>
                                                                <span className="text-gray-100">{p.description}</span>
                                                            </div>
                                                            {p.obs && (
                                                                <div className="mt-1 ml-10 bg-yellow-900/50 text-yellow-200 px-2 py-1 rounded text-lg font-bold border border-yellow-700/50 flex items-center gap-2">
                                                                    <AlertCircle size={18} /> {p.obs}
                                                                </div>
                                                            )}
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                            {o.drinks && o.drinks.length > 0 && (
                                                <ul className="space-y-3 mt-3">
                                                    {o.drinks.map((d, i) => (
                                                        <li key={`d${i}`} className="border-b border-white/10 pb-2 last:border-0 last:pb-0">
                                                            <div className="text-2xl font-bold leading-tight text-blue-300">
                                                                <span className="text-blue-400 inline-block w-8 text-right mr-2">{d.qty}x</span>
                                                                <span className="text-gray-100">{d.name}</span>
                                                            </div>
                                                        </li>
                                                    ))}
                                                </ul>
                                            )}
                                            {o.empanadas > 0 && (
                                                <div className="bg-yellow-900/30 p-2 rounded border border-yellow-600/30 mt-2 flex items-center gap-3">
                                                    <span className="text-3xl font-bold text-yellow-400 w-10 text-right">{o.empanadas}</span>
                                                    <span className="text-lg font-bold text-yellow-100 uppercase tracking-wide">Empanadas</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- APLICACIÓN PRINCIPAL ---
        function BochasApp() {
            const [view, setView] = useState('landing');
            const [orders, setOrders] = useState([]);
            const [activeLibres, setActiveLibres] = useState([]);
            const [prices, setPrices] = useState(INITIAL_PRICES);
            const [history, setHistory] = useState([]);
            const [dialog, setDialog] = useState(null);
            const [showReport, setShowReport] = useState(false);

            useEffect(() => {
                let unsubscribe = () => { };
                const init = async () => {
                    const data = await storage.loadInitial();
                    setOrders(data.orders || []);
                    setActiveLibres(data.libres || []);
                    const stored = data.prices || {};
                    const mergedPrices = {
                        ...INITIAL_PRICES,
                        ...stored,
                        flavors: { ...INITIAL_PRICES.flavors, ...(stored.flavors || {}) },
                        drinks: stored.drinks || {}
                    };
                    setPrices(mergedPrices);
                    setHistory(data.history || []);
                    unsubscribe = storage.onUpdate(({ key, value }) => {
                        if (key === 'orders') setOrders(value);
                        if (key === 'libres') setActiveLibres(value);
                        if (key === 'prices') {
                            const merged = {
                                ...INITIAL_PRICES, ...value,
                                flavors: { ...INITIAL_PRICES.flavors, ...(value.flavors || {}) },
                                drinks: value.drinks || {}
                            };
                            setPrices(merged);
                        }
                        if (key === 'history') setHistory(value);
                    });
                };
                init();
                return () => unsubscribe();
            }, []);

            const saveOrders = useCallback((d) => { setOrders(d); storage.set('orders', d); }, []);
            const saveLibres = useCallback((d) => { setActiveLibres(d); storage.set('libres', d); }, []);
            const savePrices = useCallback((d) => { setPrices(d); storage.set('prices', d); }, []);
            const saveHistory = useCallback((d) => { setHistory(d); storage.set('history', d); }, []);

            const showConfirm = useCallback((message, onConfirm) => {
                setDialog({ type: 'confirm', message, onConfirm });
            }, []);
            const showAlert = useCallback((message) => {
                setDialog({ type: 'alert', message });
            }, []);

            const renderView = () => {
                switch (view) {
                    case 'reception':
                        return (
                            <ReceptionView
                                setView={setView}
                                orders={orders}
                                setOrders={saveOrders}
                                activeLibres={activeLibres}
                                setActiveLibres={saveLibres}
                                prices={prices}
                                setPrices={savePrices}
                                history={history}
                                setHistory={saveHistory}
                                showConfirm={showConfirm}
                                showAlert={showAlert}
                                onOpenReport={() => setShowReport(true)}
                            />
                        );
                    case 'kitchen':
                        return (
                            <KitchenView
                                setView={setView}
                                orders={orders}
                                setOrders={saveOrders}
                                history={history}
                                setHistory={saveHistory}
                                showConfirm={showConfirm}
                                showAlert={showAlert}
                                prices={prices}
                                activeLibres={activeLibres}
                                onOpenReport={() => setShowReport(true)}
                            />
                        );
                    default:
                        return (
                            <Landing
                                setView={setView}
                                showConfirm={showConfirm}
                                onOpenReport={() => setShowReport(true)}
                                history={history}
                                activeLibres={activeLibres}
                                orders={orders}
                                prices={prices}
                            />
                        );
                }
            };

            return (
                <div className="min-h-screen font-sans text-gray-900 bg-gray-900 relative">
                    {renderView()}

                    {/* MODAL DE REPORTE Y GUARDADO EN PDF */}
                    <ReportModal
                        isOpen={showReport}
                        onClose={() => setShowReport(false)}
                        history={history}
                        activeLibres={activeLibres}
                        orders={orders}
                        prices={prices}
                    />

                    {/* MODAL DE DIÁLOGO */}
                    {dialog && (
                        <div className="fixed inset-0 bg-black/80 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl flex flex-col items-center text-center">
                                {dialog.type === 'alert' ? <AlertTriangle size={48} className="text-yellow-500 mb-4" /> : <HelpCircle size={48} className="text-blue-500 mb-4" />}
                                <h3 className="text-xl font-bold mb-6 text-gray-800 whitespace-pre-wrap">{dialog.message}</h3>
                                <div className="flex gap-4 w-full">
                                    {dialog.type === 'confirm' && (
                                        <button onClick={() => setDialog(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-bold">CANCELAR</button>
                                    )}
                                    <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); setDialog(null); }} className={`flex-1 text-white py-3 rounded-lg font-bold ${dialog.type === 'alert' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-red-600 hover:bg-red-700'}`}>
                                        {dialog.type === 'alert' ? 'ENTENDIDO' : 'CONFIRMAR'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BochasApp />);
    </script>
</body>

</html>
