        };

        // --- PANTALLA DE COCINA ---
        const KitchenView = ({ setView, orders, setOrders, history, setHistory, showConfirm, showAlert, prices, activeLibres, setActiveLibres, onOpenCashDetail }) => {
            const [zoom, setZoom] = useState(1);

            const totals = useMemo(() => calculateTakeawayTotals(orders, history, prices), [orders, history, prices]);

            const handleCompleteNormal = (o) => {
                showConfirm(`¿Marcar pedido de "${o.client}" como listo?`, () => {
                    setHistory([...history, { ...o, date: o.date || getLocalDateString(new Date()), completedAt: new Date().toISOString() }]);
                    setOrders(orders.filter(x => x.id !== o.id));
                });
            };

            const handleDeleteNormal = (o) => {
                showConfirm(`¿Eliminar comanda de "${o.client}" sin registrar?`, () => {
                    setOrders(orders.filter(x => x.id !== o.id));
                });
            };

            // 1. Botón "Listo (Ya salió)": retira la comanda de la pantalla de cocina y marca la mesa como servida
            const handleListoMesa = (o) => {
                setOrders(orders.filter(x => x.id !== o.id));
                if (setActiveLibres && activeLibres) {
                    const updated = activeLibres.map(l => (l.id === o.libreId || l.client === o.client) ? {
                        ...l,
                        status: 'servida',
                        lastServedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    } : l);
                    setActiveLibres(updated);
                }
            };

            // 2. Botón "Siguiente Ronda": avanza de ronda y vuelve a enviar la comanda a la pantalla de cocina
            const handleSiguienteRonda = (table) => {
                const nextRound = (table.round || 1) + 1;
                if (setActiveLibres && activeLibres) {
                    const updated = activeLibres.map(l => l.id === table.id ? {
                        ...l,
                        round: nextRound,
                        status: 'cocinando'
                    } : l);
                    setActiveLibres(updated);
                }
                const cleanOrders = orders.filter(x => x.libreId !== table.id && x.id !== table.id);
                const newOrder = {
                    id: generateId(),
                    libreId: table.id,
                    client: table.client,
                    pizzas: [],
                    drinks: [],
                    empanadas: 0,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    date: getLocalDateString(new Date()),
                    type: 'libre',
                    people: table.people,
                    round: nextRound,
                    totalPrice: 0,
                    obs: table.obs || ''
                };
                setOrders([...cleanOrders, newOrder]);
            };

            // 3. Botón "Dar de baja la mesa pq ya comió": retira la mesa definitivamente
            const handleDarDeBaja = (table) => {
                showConfirm(`¿Dar de baja la mesa "${table.client}" (${table.people} personas) porque ya terminó de comer?`, () => {
                    setOrders(orders.filter(x => x.libreId !== table.id && x.id !== table.id));
                    if (setActiveLibres && activeLibres) {
                        setActiveLibres(activeLibres.filter(x => x.id !== table.id));
                    }
                    const people = parseInt(table.people, 10) || 0;
                    const pricePerPerson = parseInt(prices.pizzaLibreH, 10) || 0;
                    setHistory([...history, {
                        id: table.id,
                        client: table.client,
                        type: 'libre',
                        people,
                        pricePerPerson,
                        totalPrice: people * pricePerPerson,
                        round: table.round,
                        timestamp: table.timestamp,
                        date: table.date || getLocalDateString(new Date()),
                        closedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        completedAt: new Date().toISOString(),
                        obs: table.obs || ''
                    }]);
                });
            };

            return (
                <div className="bg-black min-h-screen text-white flex flex-col overflow-hidden relative">
                    {/* HEADER DE COCINA */}
                    <div className="bg-red-800 p-3 flex justify-between items-center shadow-lg border-b-4 border-red-900 z-10 shrink-0">
                        <h1 className="text-2xl font-bold uppercase tracking-wider flex items-center gap-3">
                            <ChefHat size={32} /> COCINA
                        </h1>
                        <div className="flex gap-2 items-center">
                            <button
                                onClick={onOpenCashDetail}
                                className="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-white font-bold flex items-center gap-2 shadow transition hover:scale-105"
                                title="Ver detalle de caja (pizzas y empanadas con nombre)"
                            >
                                <DollarSign size={20} /> TOTAL CAJA (${totals.granTotalRecaudado.toLocaleString()})
                            </button>
                            <button onClick={() => setZoom(z => Math.max(0.6, Math.round((z - 0.1) * 10) / 10))} className="bg-white/10 p-2 rounded-lg ml-2 hover:bg-white/20" title="Alejar"><ZoomOut size={20} /></button>
                            <span className="text-xs font-mono font-bold text-red-200 px-1.5 py-0.5 rounded bg-black/30 border border-white/10">{Math.round(zoom * 100)}%</span>
                            <button onClick={() => setZoom(z => Math.min(1.6, Math.round((z + 0.1) * 10) / 10))} className="bg-white/10 p-2 rounded-lg hover:bg-white/20" title="Acercar"><ZoomIn size={20} /></button>
                            <button onClick={() => setView('landing')} className="text-xs ml-4 text-red-300 underline self-center hover:text-white">Salir</button>
                        </div>
                    </div>

                    {/* PEDIDOS EN PANTALLA DE COCINA (EN PREPARACIÓN) */}
                    <div className="flex-1 overflow-auto p-4 bg-zinc-900 flex flex-col">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-sm font-black text-gray-300 uppercase tracking-wider flex items-center gap-2">
                                <Monitor size={18} className="text-yellow-400" /> Comandas en Preparación
                                <span className="bg-red-600 text-white text-xs px-2.5 py-0.5 rounded-full font-black">
                                    {orders.length}
                                </span>
                            </h2>
                            <span className="text-xs text-gray-400">
                                Vista de comandas para elaboración (se confirma y despacha desde Recepción)
                            </span>
                        </div>

                        {orders.length === 0 ? (
                            <div className="flex-1 flex flex-col items-center justify-center opacity-30 py-16">
                                <ChefHat size={100} />
                                <h2 className="text-3xl font-bold mt-3">Sin comandas pendientes en cocina</h2>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3.5 sm:gap-4 items-start content-start" style={{ zoom: zoom }}>
                                {orders.map((o) => {
                                    if (o.type === 'libre') {
                                        return (
                                            <div key={o.id} className="relative rounded-2xl overflow-hidden shadow-2xl bg-indigo-950/90 border-2 border-indigo-500 flex flex-col justify-between">
                                                {/* HEADER COMANDA LIBRE */}
                                                <div className="p-3 bg-indigo-800 text-white flex justify-between items-start border-b border-indigo-700">
                                                    <div className="overflow-hidden">
                                                        <h3 className="text-2xl sm:text-3xl font-black text-yellow-300 truncate leading-none mb-1">{o.client}</h3>
                                                        <div className="flex items-center gap-2 text-indigo-200 font-mono text-xs">
                                                            <span>{o.timestamp}</span>
                                                            <span className="bg-indigo-950 px-2 py-0.5 rounded font-black text-yellow-300 border border-yellow-500/40">
                                                                {getLibreRoundTitle(o.round)}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* CONTENIDO COMANDA */}
                                                <div className="p-3 sm:p-4 space-y-2.5">
                                                    <div className="bg-indigo-900/60 p-3 rounded-xl border border-indigo-400/40 text-center space-y-1.5">
                                                        <div className="text-xl sm:text-2xl text-yellow-300 uppercase font-black tracking-wider">
                                                            {getLibreRoundTitle(o.round)}
                                                        </div>
                                                        <div className="text-xl sm:text-2xl font-black text-white flex items-center justify-center gap-2 bg-indigo-950/70 py-1 px-3 rounded-lg border border-indigo-400/30 w-fit mx-auto">
                                                            <Users size={20} className="text-indigo-300" /> {o.people} pers.
                                                        </div>
                                                        <div className="text-[11px] text-indigo-300 font-medium">
                                                            Preparar tandas para la mesa
                                                        </div>
                                                    </div>

                                                    {o.obs && (
                                                        <div className="bg-amber-400 text-amber-950 p-2.5 sm:p-3 rounded-xl border-2 border-yellow-300 font-black shadow-md flex items-start gap-2">
                                                            <AlertCircle className="text-amber-900 shrink-0 mt-0.5" size={20} />
                                                            <div className="flex-1 min-w-0">
                                                                <span className="text-[10px] tracking-wider uppercase block text-amber-900 font-extrabold leading-none mb-0.5">Observación:</span>
                                                                <span className="text-sm sm:text-base font-black leading-snug break-words">{o.obs}</span>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    }

                                    // PEDIDOS A LA CARTA
                                    const isTakeaway = o.destination ? (o.destination === 'llevar') : !isTableNumber(o.client);

                                    return (
                                        <div key={o.id} className="relative rounded-2xl overflow-hidden shadow-2xl bg-gray-800 border border-gray-700 flex flex-col justify-between">
                                            <div className={`p-3 flex justify-between items-start border-b ${isTakeaway ? 'bg-sky-950/90 border-sky-800' : 'bg-gray-700 border-gray-600'}`}>
                                                <div className="overflow-hidden">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <h3 className="text-2xl sm:text-3xl font-black text-yellow-400 truncate leading-none">{o.client}</h3>
                                                    </div>
                                                    <div className="flex items-center gap-2 text-gray-300 font-mono text-xs">
                                                        <span>{o.timestamp}</span>
                                                        {isTakeaway ? (
                                                            <span className="bg-sky-600 text-white font-black text-[11px] px-2 py-0.5 rounded shadow">
                                                                PARA LLEVAR
                                                            </span>
                                                        ) : (
                                                            <span className="bg-purple-600 text-white font-black text-[11px] px-2 py-0.5 rounded shadow">
                                                                COMER
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="p-3 sm:p-4 space-y-2.5 flex-1">
                                                {o.obs && (
                                                    <div className="bg-amber-400 text-amber-950 p-2.5 sm:p-3 rounded-xl border-2 border-yellow-300 font-black shadow-md flex items-start gap-2">
                                                        <AlertCircle className="text-amber-900 shrink-0 mt-0.5" size={20} />
                                                        <div className="flex-1 min-w-0">
                                                            <span className="text-[10px] tracking-wider uppercase block text-amber-900 font-extrabold leading-none mb-0.5">Observación:</span>
                                                            <span className="text-sm sm:text-base font-black leading-snug break-words">{o.obs}</span>
                                                        </div>
                                                    </div>
                                                )}
                                                {Array.isArray(o.pizzas) && o.pizzas.length > 0 && (
                                                    <ul className="space-y-2.5">
                                                        {o.pizzas.map((p, i) => (
                                                            <li key={i} className="border-b border-white/10 pb-2 last:border-0 last:pb-0">
                                                                <div className="text-xl font-bold leading-tight flex items-start justify-between gap-2">
                                                                    <div className="flex-1 min-w-0">
                                                                        <span className="text-green-400 inline-block w-7 text-right mr-2 shrink-0">{p.qty}x</span>
                                                                        <span className="text-gray-100">{p.description}</span>
                                                                    </div>
                                                                    {p.withBox ? (
                                                                        <span className="text-[11px] font-black text-sky-200 bg-sky-950 border border-sky-500/60 px-2 py-0.5 rounded shrink-0">
                                                                            CON CAJA
                                                                        </span>
                                                                    ) : (
                                                                        <span className="text-[11px] font-semibold text-gray-400 bg-gray-900 border border-gray-700 px-2 py-0.5 rounded shrink-0">
                                                                            SIN CAJA
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                {p.obs && (
                                                                    <div className="mt-1 ml-9 bg-amber-400 text-amber-950 px-2 py-1 rounded-md text-xs font-black border border-yellow-300 shadow-sm flex items-center gap-1.5">
                                                                        <AlertCircle size={14} className="text-amber-900 shrink-0" /> <span className="uppercase">Obs: {p.obs}</span>
                                                                    </div>
                                                                )}
                                                            </li>
                                                        ))}
                                                    </ul>
                                                )}
                                                {Array.isArray(o.drinks) && o.drinks.length > 0 && (
                                                    <ul className="space-y-1.5 mt-2 border-t border-white/10 pt-2">
                                                        {o.drinks.map((d, i) => (
                                                            <li key={`d${i}`} className="text-base font-bold text-blue-300">
                                                                <span className="text-blue-400 mr-2">{d.qty}x</span> {d.name}
                                                            </li>
                                                        ))}
                                                    </ul>
                                                )}
                                                {o.empanadas > 0 && (
                                                    <div className="bg-yellow-900/40 p-2.5 rounded-xl border border-yellow-600/40 mt-2 flex items-center justify-between">
                                                        <div className="flex items-center gap-3">
                                                            <span className="text-3xl font-black text-yellow-400 w-8 text-right">{o.empanadas}</span>
                                                            <span className="text-base font-bold text-yellow-100 uppercase tracking-wide">Empanadas</span>
                                                        </div>
                                                        <span className="text-xs text-yellow-300 font-bold bg-yellow-900/60 px-2 py-1 rounded">Cocinar</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- APLICACIÓN PRINCIPAL ---
        function BochasApp() {
            const [view, setView] = useState('landing');
            const [orders, setOrders] = useState([]);
            const [activeLibres, setActiveLibres] = useState([]);
            const [prices, setPrices] = useState(INITIAL_PRICES);
            const [history, setHistory] = useState([]);
            const [dialog, setDialog] = useState(null);
            const [showCashDetail, setShowCashDetail] = useState(false);

            useEffect(() => {
                let unsubscribe = () => { };
                const init = async () => {
                    const data = await storage.loadInitial();
                    setOrders(data.orders || []);
                    setActiveLibres(data.libres || []);
                    const stored = data.prices || {};
                    const mergedPrices = {
                        ...INITIAL_PRICES,
                        ...stored,
                        flavors: { ...INITIAL_PRICES.flavors, ...(stored.flavors || {}) },
                        drinks: stored.drinks || {}
                    };
                    setPrices(mergedPrices);
                    setHistory(data.history || []);
                    unsubscribe = storage.onUpdate(({ key, value }) => {
                        if (key === 'orders') setOrders(value);
                        if (key === 'libres') setActiveLibres(value);
                        if (key === 'prices') {
                            const merged = {
                                ...INITIAL_PRICES, ...value,
                                flavors: { ...INITIAL_PRICES.flavors, ...(value.flavors || {}) },
                                drinks: value.drinks || {}
                            };
                            setPrices(merged);
                        }
                        if (key === 'history') setHistory(value);
                    });
                };
                init();
                return () => unsubscribe();
            }, []);

            const saveOrders = useCallback((d) => { setOrders(d); storage.set('orders', d); }, []);
            const saveLibres = useCallback((d) => { setActiveLibres(d); storage.set('libres', d); }, []);
            const savePrices = useCallback((d) => { setPrices(d); storage.set('prices', d); }, []);
            const saveHistory = useCallback((d) => { setHistory(d); storage.set('history', d); }, []);

            const showConfirm = useCallback((message, onConfirm) => {
                setDialog({ type: 'confirm', message, onConfirm });
            }, []);
            const showAlert = useCallback((message) => {
                setDialog({ type: 'alert', message });
            }, []);

            const renderView = () => {
                switch (view) {
                    case 'reception':
                        return (
                            <ReceptionView
                                setView={setView}
                                orders={orders}
                                setOrders={saveOrders}
                                activeLibres={activeLibres}
                                setActiveLibres={saveLibres}
                                prices={prices}
                                setPrices={savePrices}
                                history={history}
                                setHistory={saveHistory}
                                showConfirm={showConfirm}
                                showAlert={showAlert}
                                onOpenCashDetail={() => setShowCashDetail(true)}
                            />
                        );
                    case 'kitchen':
                        return (
                            <KitchenView
                                setView={setView}
                                orders={orders}
                                setOrders={saveOrders}
                                history={history}
                                setHistory={saveHistory}
                                showConfirm={showConfirm}
                                showAlert={showAlert}
                                prices={prices}
                                activeLibres={activeLibres}
                                setActiveLibres={saveLibres}
                                onOpenCashDetail={() => setShowCashDetail(true)}
                            />
                        );
                    default:
                        return (
                            <Landing
                                setView={setView}
                                showConfirm={showConfirm}
                                onOpenCashDetail={() => setShowCashDetail(true)}
                                history={history}
                                activeLibres={activeLibres}
                                orders={orders}
                                prices={prices}
                            />
                        );
                }
            };

            return (
                <div className={`min-h-screen font-sans ${view === 'kitchen' ? 'bg-black text-white' : (view === 'landing' ? 'bg-sky-50 text-slate-800' : 'bg-gray-100 text-gray-900')} relative`}>
                    <div>
                        {renderView()}
                    </div>

                    {/* MODAL DETALLE DE CAJA Y CONTROL DE VENTAS */}
                    <CashDetailModal
                        isOpen={showCashDetail}
                        onClose={() => setShowCashDetail(false)}
                        orders={orders}
                        history={history}
                        prices={prices}
                    />

                    {/* MODAL DE DIÁLOGO */}
                    {dialog && (
                        <div className="fixed inset-0 bg-black/80 z-[9999] flex items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl flex flex-col items-center text-center">
                                {dialog.type === 'alert' ? <AlertTriangle size={48} className="text-yellow-500 mb-4" /> : <HelpCircle size={48} className="text-blue-500 mb-4" />}
                                <h3 className="text-xl font-bold mb-6 text-gray-800 whitespace-pre-wrap">{dialog.message}</h3>
                                <div className="flex gap-4 w-full">
                                    {dialog.type === 'confirm' && (
                                        <button onClick={() => setDialog(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-bold">CANCELAR</button>
                                    )}
                                    <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); setDialog(null); }} className={`flex-1 text-white py-3 rounded-lg font-bold ${dialog.type === 'alert' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-red-600 hover:bg-red-700'}`}>
                                        {dialog.type === 'alert' ? 'ENTENDIDO' : 'CONFIRMAR'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BochasApp />);
    </script>
</body>

</html>
