<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Sistema Club de Bochas - Gestión</title>

    <style>
        #error-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            color: #ff5555;
            z-index: 9999;
            padding: 40px;
            font-family: monospace;
            font-size: 16px;
            white-space: pre-wrap;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
            background-color: #111827;
            color: white;
        }

        /* Optimizaciones de renderizado */
        .fast-input {
            contain: content;
        }
    </style>
</head>

<body class="bg-gray-900 h-screen overflow-hidden">

    <div id="error-overlay"></div>
    <div id="root" class="h-full"></div>

    <script>
        window.onerror = function (msg, url, line) {
            const ov = document.getElementById('error-overlay');
            ov.style.display = 'block';
            ov.textContent = "⛔ ERROR:\n" + msg + "\nEn: " + url + ":" + line;
            return false;
        };
    </script>

    <script src="./libs/tailwindcss.js"></script>
    <script src="./libs/react.development.js"></script>
    <script src="./libs/react-dom.development.js"></script>
    <script src="./libs/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- ICONOS (Optimizados como constantes) ---
        const Icon = ({ d, color = "currentColor", size = 20, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{d}</svg>;
        const Pizza = () => <Icon d={<><path d="M15 11h.01" /><path d="M11 15h.01" /><path d="M16 16h.01" /><path d="m2 16 20 6-6-20A20 20 0 0 0 2 16" /><path d="M5.71 17.11a17.04 17.04 0 0 1 11.4-11.4" /></>} />;
        const ChefHat = (p) => <Icon {...p} d={<><path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 1 0-7.454-3.489A3.999 3.999 0 0 0 5.273 13.61c.41.197.727.584.727 1.041V20a1 1 0 0 0 1 1h10z" /><path d="M6 17h12" /></>} />;
        const Trash2 = (p) => <Icon {...p} d={<><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></>} />;
        const Users = (p) => <Icon {...p} d={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>} />;
        const Utensils = (p) => <Icon {...p} d={<><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" /><path d="M7 2v20" /><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" /></>} />;
        const Monitor = (p) => <Icon {...p} d={<><rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" /></>} />;
        const User = (p) => <Icon {...p} d={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>} />;
        const Settings = (p) => <Icon {...p} d={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V2a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></>} />;
        const X = (p) => <Icon {...p} d={<><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>} />;
        const ZoomIn = (p) => <Icon {...p} d={<><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="11" x2="11" y1="8" y2="14" /><line x1="8" x2="14" y1="11" y2="11" /></>} />;
        const ZoomOut = (p) => <Icon {...p} d={<><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /><line x1="8" x2="14" y1="11" y2="11" /></>} />;
        const AlertCircle = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></>} />;
        const Check = (p) => <Icon {...p} d={<><polyline points="20 6 9 17 4 12" /></>} />;
        const DollarSign = (p) => <Icon {...p} d={<><line x1="12" x2="12" y1="2" y2="22" /><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></>} />;
        const AlertTriangle = (p) => <Icon {...p} d={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" x2="12" y1="9" y2="13" /><line x1="12" x2="12.01" y1="17" y2="17" /></>} />;
        const HelpCircle = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" x2="12.01" y1="17" y2="17" /></>} />;
        const PackageIcon = (p) => <Icon {...p} d={<><path d="m7.5 4.27 9 5.15" /><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" /></>} />;
        const CupSoda = (p) => <Icon {...p} d={<><path d="m6 8 1.75 12.28a2 2 0 0 0 2 1.72h4.5a2 2 0 0 0 2-1.72L18 8" /><path d="M5 8h14" /><path d="M7 15a6.47 6.47 0 0 1 5 0 6.47 6.47 0 0 0 5 0" /><line x1="12" x2="12" y1="8" y2="2" /></>} />;

        const DEFAULT_FLAVORS = ["Muzzarella", "Provenzal", "Cebolla", "Calabresa", "Margarita", "Napolitana", "Anchoa", "Rúcula", "Especial", "3 Quesos", "Roquefort"];
        const INITIAL_PRICES = {
            box: 0,
            empanada: 0,
            pizzaLibreH: 0,
            flavors: DEFAULT_FLAVORS.reduce((acc, f) => { acc[f] = { entera: 0, media: 0 }; return acc; }, {}),
            drinks: {}
        };

        const storage = window.__BOCHAS_STORAGE__ || {
            loadInitial: async () => ({ orders: [], libres: [], prices: INITIAL_PRICES, history: [] }),
            set: async () => { },
            onUpdate: () => () => { }
        };

        // --- COMPONENTES MEMORIZADOS (Para evitar lag) ---
        // Estos componentes NO se redibujan cuando escribes en los inputs

        const ActiveLibresList = React.memo(({ libres, onRound, onClose }) => {
            return (
                <div className="flex-1 overflow-y-auto p-2 space-y-2">
                    {libres.map(l => (
                        <div key={l.id} className="bg-white p-3 rounded border-l-4 border-purple-500 shadow flex justify-between items-center">
                            <div><div className="font-bold text-purple-900">{l.client}</div><div className="text-xs text-gray-600">{l.people} pers. | {l.timestamp}</div></div>
                            <div className="flex items-center gap-2">
                                <div className="text-right mr-2"><div className="font-black text-2xl text-purple-600">{l.round}ª</div></div>
                                <button onClick={() => onRound(l)} className="bg-purple-600 text-white px-3 py-2 rounded shadow font-bold text-sm hover:bg-purple-700">SUBIR</button>
                                <button onClick={() => onClose(l)} className="text-red-400 p-2 hover:text-red-600"><Trash2 size={20} /></button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        });

        const KitchenOrdersList = React.memo(({ orders, onComplete, onDelete, prices }) => {
            return (
                <div className="flex-1 overflow-y-auto p-3 grid grid-cols-1 sm:grid-cols-2 gap-2.5 content-start">
                    {orders.map((o) => (
                        <div key={o.id} className={`bg-white rounded-lg shadow border-l-4 ${o.type === 'libre' ? 'border-purple-500' : 'border-blue-500'} flex flex-col justify-between`}>
                            <div className="p-2 border-b border-gray-100 bg-gray-50/70 rounded-t-lg flex items-start justify-between">
                                <div className="overflow-hidden mr-1">
                                    <div className="font-black text-base text-gray-800 truncate leading-snug">{o.client}</div>
                                    <div className="text-[10px] text-gray-500 font-mono">{o.timestamp}</div>
                                </div>
                                <div className="flex flex-col items-end gap-1 shrink-0">
                                    <div className="flex gap-1">
                                        <button onClick={() => onComplete(o)} className="bg-green-100 text-green-600 p-1.5 rounded hover:bg-green-200 flex items-center gap-1 font-bold text-xs" title="Completar y Sumar"><Check size={14} /> Listo</button>
                                        <button onClick={() => onDelete(o)} className="bg-red-100 text-red-600 p-1.5 rounded hover:bg-red-200" title="Eliminar"><Trash2 size={14} /></button>
                                    </div>
                                    {o.type === 'libre' ? <span className="text-purple-600 font-black text-xs">{o.round}ª RONDA</span> : <span className="text-sm font-bold text-green-700">${(o.totalPrice || 0).toLocaleString()}</span>}
                                </div>
                            </div>
                            <div className="p-2 text-xs text-gray-700 space-y-0.5">
                                {o.type === 'libre' && o.obs && <div className="text-orange-600 font-bold mb-1">⚠️ {o.obs}</div>}
                                {o.pizzas.map((p, i) => (<div key={i} className="leading-tight">• <strong className="text-gray-900">{p.qty}x</strong> {p.description} {p.obs && <span className="text-orange-600 italic">({p.obs})</span>}</div>))}
                                {o.drinks && o.drinks.map((d, i) => (<div key={`d${i}`} className="text-blue-700 font-bold leading-tight">• <strong>{d.qty}x</strong> {d.name}</div>))}
                                {o.empanadas > 0 && <div className="font-bold text-yellow-700 mt-0.5">🥟 {o.empanadas} Empanadas</div>}
                            </div>
                        </div>
                    ))}
                </div>
            );
        });

        function BochasApp() {
            const [view, setView] = useState('landing');
            const [orders, setOrders] = useState([]);
            const [activeLibres, setActiveLibres] = useState([]);
            const [prices, setPrices] = useState(INITIAL_PRICES);
            const [history, setHistory] = useState([]);
            const [dialog, setDialog] = useState(null);

            useEffect(() => {
                let unsubscribe = () => { };
                const init = async () => {
                    const data = await storage.loadInitial();
                    setOrders(data.orders || []);
                    setActiveLibres(data.libres || []);
                    // Siempre hacer merge con INITIAL_PRICES para que los gustos por defecto
                    // estén siempre presentes, y se puedan agregar más en el futuro.
                    const stored = data.prices || {};
                    const mergedPrices = {
                        ...INITIAL_PRICES,
                        ...stored,
                        flavors: { ...INITIAL_PRICES.flavors, ...(stored.flavors || {}) },
                        drinks: stored.drinks || {},
                        ticket: { ...INITIAL_PRICES.ticket, ...(stored.ticket || {}) }
                    };
                    setPrices(mergedPrices);
                    setHistory(data.history || []);
                    unsubscribe = storage.onUpdate(({ key, value }) => {
                        if (key === 'orders') setOrders(value);
                        if (key === 'libres') setActiveLibres(value);
                        if (key === 'prices') {
                            const merged = {
                                ...INITIAL_PRICES, ...value,
                                flavors: { ...INITIAL_PRICES.flavors, ...(value.flavors || {}) },
                                drinks: value.drinks || {},
                                ticket: { ...INITIAL_PRICES.ticket, ...(value.ticket || {}) }
                            };
                            setPrices(merged);
                        }
                        if (key === 'history') setHistory(value);
                    });
                };
                init();
                return () => unsubscribe();
            }, []);

            const saveOrders = useCallback((d) => { setOrders(d); storage.set('orders', d); }, []);
            const saveLibres = useCallback((d) => { setActiveLibres(d); storage.set('libres', d); }, []);
            const savePrices = useCallback((d) => { setPrices(d); storage.set('prices', d); }, []);
            const saveHistory = useCallback((d) => { setHistory(d); storage.set('history', d); }, []);

            const showConfirm = useCallback((message, onConfirm) => {
                setDialog({ type: 'confirm', message, onConfirm });
            }, []);
            const showAlert = useCallback((message) => {
                setDialog({ type: 'alert', message });
            }, []);

            const renderView = () => {
                switch (view) {
                    case 'reception': return <ReceptionView setView={setView} orders={orders} setOrders={saveOrders} activeLibres={activeLibres} setActiveLibres={saveLibres} prices={prices} setPrices={savePrices} history={history} setHistory={saveHistory} showConfirm={showConfirm} showAlert={showAlert} />;
                    case 'kitchen': return <KitchenView setView={setView} orders={orders} setOrders={saveOrders} history={history} setHistory={saveHistory} showConfirm={showConfirm} showAlert={showAlert} prices={prices} />;
                    default: return <Landing setView={setView} showConfirm={showConfirm} />;
                }
            };

            return (
                <div className="min-h-screen font-sans text-gray-900 bg-gray-900 relative">
                    {renderView()}
                    {dialog && (
                        <div className="fixed inset-0 bg-black/80 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl flex flex-col items-center text-center">
                                {dialog.type === 'alert' ? <AlertTriangle size={48} className="text-yellow-500 mb-4" /> : <HelpCircle size={48} className="text-blue-500 mb-4" />}
                                <h3 className="text-xl font-bold mb-6 text-gray-800 whitespace-pre-wrap">{dialog.message}</h3>
                                <div className="flex gap-4 w-full">
                                    {dialog.type === 'confirm' && (
                                        <button onClick={() => setDialog(null)} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-bold">CANCELAR</button>
                                    )}
                                    <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); setDialog(null); }} className={`flex-1 text-white py-3 rounded-lg font-bold ${dialog.type === 'alert' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-red-600 hover:bg-red-700'}`}>
                                        {dialog.type === 'alert' ? 'ENTENDIDO' : 'CONFIRMAR'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const Landing = ({ setView, showConfirm }) => {
            const [cleared, setCleared] = useState(false);

            const handleClear = async () => {
                showConfirm('🚨 ¿Seguro que quieres CERRAR CAJA? Se vaciarán pedidos y mesas (los precios se mantienen).', async () => {
                    await storage.clearAll();
                    setCleared(true);
                    setTimeout(() => setCleared(false), 3000);
                });
            };

            return (
                <div className="flex flex-col items-center justify-center h-screen bg-slate-900 text-white p-8 select-none relative">
                    <img src="./FOTO.PNG" alt="Logo" className="w-48 h-auto mb-6 rounded-2xl shadow-2xl" onError={(e) => e.target.style.display = 'none'} />
                    <h1 className="text-5xl font-black mb-4 text-yellow-400 flex items-center gap-4"><Pizza /> Sistema Rivera </h1>
                    <div className="flex gap-12 mt-8">
                        <button onClick={() => setView('reception')} className="bg-white text-slate-800 w-64 h-64 rounded-2xl shadow-2xl hover:scale-105 transition flex flex-col items-center justify-center gap-4">
                            <User size={60} className="text-blue-600" /><span className="text-2xl font-bold">RECEPCIÓN</span>
                        </button>
                        <button onClick={() => setView('kitchen')} className="bg-slate-800 text-white w-64 h-64 rounded-2xl shadow-2xl hover:scale-105 transition flex flex-col items-center justify-center gap-4 border border-slate-700">
                            <ChefHat size={60} className="text-red-500" /><span className="text-2xl font-bold">COCINA</span>
                        </button>
                    </div>

                    {storage.openNewWindow && (
                        <button onClick={() => storage.openNewWindow()} className="mt-12 flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-bold shadow-lg transition">
                            <Monitor size={24} /> ABRIR OTRA PANTALLA
                        </button>
                    )}

                    <button onClick={handleClear} disabled={cleared} className={`absolute bottom-8 right-8 flex items-center gap-2 px-6 py-3 rounded-lg font-bold shadow-lg transition ${cleared ? 'bg-green-600 text-white' : 'bg-red-600/80 hover:bg-red-600 text-white'}`}>
                        {cleared ? <Check size={24} /> : <Trash2 size={24} />}
                        {cleared ? 'CAJA CERRADA' : 'CERRAR CAJA'}
                    </button>
                </div>
            );
        };

        const ReceptionView = ({ setView, orders, setOrders, activeLibres, setActiveLibres, prices, setPrices, history, setHistory, showConfirm, showAlert }) => {
            const [showPriceConfig, setShowPriceConfig] = useState(false);
            const [configTab, setConfigTab] = useState('precios'); // 'precios' | 'ticket'
            const [localPrices, setLocalPrices] = useState(prices);
            const [newFlavorName, setNewFlavorName] = useState('');
            const [newDrinkName, setNewDrinkName] = useState('');
            const [newDrinkPrice, setNewDrinkPrice] = useState('');
            const [isLibre, setIsLibre] = useState(false);
            const [currentPizzas, setCurrentPizzas] = useState([]);
            const [currentDrinks, setCurrentDrinks] = useState([]);
            const [withBox, setWithBox] = useState(false);
            const [empQtyInput, setEmpQtyInput] = useState('');
            const [peopleQtyInput, setPeopleQtyInput] = useState('');

            const clientNameRef = useRef(null);
            const peopleQtyRef = useRef(null);
            const libreObsRef = useRef(null);
            const empanadasRef = useRef(null);
            const obsRef = useRef(null);
            const pizzaQtyRef = useRef(null);
            const drinkSelectRef = useRef(null);
            const drinkQtyRef = useRef(null);

            const [selectedFlavors, setSelectedFlavors] = useState([]);
            const [pizzaTypeUI, setPizzaTypeUI] = useState('entera');
            const pizzaFlavors = Object.keys(prices.flavors || {});

            const calculatedTotal = useMemo(() => {
                if (isLibre) {
                    const people = parseInt(peopleQtyInput) || 0;
                    const librePrice = parseInt(prices.pizzaLibreH) || 0;
                    return people * librePrice;
                }
                const pizzasSum = currentPizzas.reduce((sum, p) => sum + (parseInt(p.price) || 0) * (parseInt(p.qty) || 1), 0);
                const drinksSum = currentDrinks.reduce((sum, d) => sum + (parseInt(d.price) || 0) * (parseInt(d.qty) || 1), 0);
                const empQty = parseInt(empQtyInput) || 0;
                const empSum = empQty * (parseInt(prices.empanada) || 0);
                return pizzasSum + drinksSum + empSum;
            }, [isLibre, peopleQtyInput, prices.pizzaLibreH, prices.empanada, currentPizzas, currentDrinks, empQtyInput]);

            const handleFlavorClick = (flavor) => {
                const idx = selectedFlavors.indexOf(flavor);
                if (idx !== -1) {
                    setSelectedFlavors(selectedFlavors.filter(f => f !== flavor));
                } else {
                    if (selectedFlavors.length < 3) {
                        setSelectedFlavors([...selectedFlavors, flavor]);
                    } else {
                        showAlert("Máximo 3 gustos por pizza");
                    }
                }
            };

            const getPizzaPrice = (type, uniqueFlavors) => {
                if (uniqueFlavors.length === 0) return 0;
                if (uniqueFlavors.length === 1) {
                    const p = prices.flavors[uniqueFlavors[0]] || { entera: 0, media: 0 };
                    return type === 'mitad' ? parseInt(p.media) || 0 : parseInt(p.entera) || 0;
                }
                if (uniqueFlavors.length === 2) {
                    const p1 = prices.flavors[uniqueFlavors[0]] || { entera: 0, media: 0 };
                    const p2 = prices.flavors[uniqueFlavors[1]] || { entera: 0, media: 0 };
                    const sumMedias = (parseInt(p1.media) || 0) + (parseInt(p2.media) || 0);
                    return type === 'mitad' ? sumMedias / 2 : sumMedias;
                }
                if (uniqueFlavors.length === 3) {
                    const p1 = prices.flavors[uniqueFlavors[0]] || { entera: 0, media: 0 };
                    const p2 = prices.flavors[uniqueFlavors[1]] || { entera: 0, media: 0 };
                    const p3 = prices.flavors[uniqueFlavors[2]] || { entera: 0, media: 0 };
                    const sumMedias3 = (parseInt(p1.media) || 0) + (parseInt(p2.media) || 0) + (parseInt(p3.media) || 0);
                    return type === 'mitad' ? Math.round(sumMedias3 / 4) : Math.round(sumMedias3 / 2);
                }
                return 0;
            };

            const addPizza = () => {
                if (selectedFlavors.length === 0) return showAlert("Seleccioná al menos un gusto");

                const qty = parseInt(pizzaQtyRef.current?.value) || 1;
                const obs = obsRef.current?.value || "";

                const type = pizzaTypeUI; // 'entera' | 'mitad'

                let flavorText = "";
                if (selectedFlavors.length === 1) {
                    flavorText = selectedFlavors[0];
                } else if (selectedFlavors.length === 2) {
                    flavorText = selectedFlavors.join(' y ');
                } else {
                    flavorText = `${selectedFlavors.slice(0, -1).join(', ')} y ${selectedFlavors[selectedFlavors.length - 1]}`;
                }

                let desc = type === 'mitad' ? `Media ${flavorText}` : flavorText;

                const unitPrice = getPizzaPrice(type, selectedFlavors);
                const boxPrice = withBox ? (parseInt(prices.box) || 0) : 0;
                const totalUnitPrice = unitPrice + boxPrice;

                setCurrentPizzas([...currentPizzas, { id: Date.now(), description: desc, qty, type, price: totalUnitPrice, obs, withBox }]);

                setSelectedFlavors([]);
                if (obsRef.current) obsRef.current.value = "";
                if (pizzaQtyRef.current) pizzaQtyRef.current.value = 1;
                setPizzaTypeUI('entera');
                setWithBox(false);
            };

            const addDrinkQuick = (drinkName) => {
                const price = parseInt(prices.drinks[drinkName]) || 0;
                const existingIndex = currentDrinks.findIndex(d => d.name === drinkName);
                if (existingIndex !== -1) {
                    const updated = [...currentDrinks];
                    updated[existingIndex].qty += 1;
                    setCurrentDrinks(updated);
                } else {
                    setCurrentDrinks([...currentDrinks, { id: Date.now(), name: drinkName, qty: 1, price }]);
                }
            };

            const addDrink = () => {
                const drinkName = drinkSelectRef.current?.value;
                const qty = parseInt(drinkQtyRef.current?.value) || 1;
                if (!drinkName) return showAlert("Falta elegir bebida");
                const price = parseInt(prices.drinks[drinkName]) || 0;
                const existingIndex = currentDrinks.findIndex(d => d.name === drinkName);
                if (existingIndex !== -1) {
                    const updated = [...currentDrinks];
                    updated[existingIndex].qty += qty;
                    setCurrentDrinks(updated);
                } else {
                    setCurrentDrinks([...currentDrinks, { id: Date.now(), name: drinkName, qty, price }]);
                }
                if (drinkSelectRef.current) drinkSelectRef.current.value = "";
                if (drinkQtyRef.current) drinkQtyRef.current.value = 1;
            };

            const submitOrder = () => {
                const client = clientNameRef.current.value.trim();
                if (!client) return showAlert("Falta nombre");

                const newId = Date.now();
                if (isLibre) {
                    const people = peopleQtyRef.current.value;
                    const obs = libreObsRef.current.value;
                    if (!people) return showAlert("Falta cantidad personas");

                    const newLibre = { id: newId, client, people, round: 1, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), obs };
                    setActiveLibres([...activeLibres, newLibre]);
                    setOrders([...orders, { ...newLibre, type: 'libre', pizzas: [], drinks: [], empanadas: 0, totalPrice: 0, id: newId + '_1', libreId: newId }]);

                    peopleQtyRef.current.value = "";
                    libreObsRef.current.value = "";
                    setPeopleQtyInput('');
                } else {
                    const empQty = parseInt(empanadasRef.current.value) || 0;
                    if (currentPizzas.length === 0 && empQty === 0 && currentDrinks.length === 0) return showAlert("Pedido vacío");

                    let total = currentPizzas.reduce((sum, p) => sum + (p.price * p.qty), 0) + (empQty * (prices.empanada || 0)) + currentDrinks.reduce((sum, d) => sum + (d.price * d.qty), 0);
                    setOrders([...orders, { id: newId, client, pizzas: currentPizzas, drinks: currentDrinks, empanadas: empQty, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), type: 'normal', totalPrice: total }]);

                    setCurrentPizzas([]);
                    setCurrentDrinks([]);
                    empanadasRef.current.value = "";
                    setEmpQtyInput('');
                }
                clientNameRef.current.value = "";
                clientNameRef.current.focus();
            };

            // Callbacks estables para las listas memorizadas
            const handleRound = useCallback((l) => {
                const nr = l.round + 1;
                const updated = activeLibres.map(x => x.id === l.id ? { ...x, round: nr } : x);
                setActiveLibres(updated);
                setOrders([...orders, { id: Date.now(), client: l.client, pizzas: [], drinks: [], empanadas: 0, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), type: 'libre', people: l.people, round: nr, totalPrice: 0, obs: l.obs, libreId: l.id }]);
            }, [activeLibres, orders, setActiveLibres, setOrders]);

            const handleCloseLibre = useCallback((l) => {
                showConfirm("¿Cerrar Mesa?", () => {
                    setActiveLibres(activeLibres.filter(x => x.id !== l.id));
                    setOrders(orders.filter(x => x.libreId !== l.id));
                });
            }, [activeLibres, orders, setActiveLibres, setOrders, showConfirm]);

            const handleDeleteOrder = useCallback((o) => {
                showConfirm('¿Eliminar sin sumar al total?', () => {
                    setOrders(orders.filter(x => x.id !== o.id));
                });
            }, [orders, setOrders, showConfirm]);

            const handleCompleteOrder = useCallback((o) => {
                if (o.type === 'libre') {
                    setHistory([...history, { ...o, completedAt: new Date().toISOString() }]);
                    setOrders(orders.filter(x => x.id !== o.id));
                    return;
                }
                showConfirm('¿Marcar como completado? Esto lo sumará al total registrado.', () => {
                    setHistory([...history, { ...o, completedAt: new Date().toISOString() }]);
                    setOrders(orders.filter(x => x.id !== o.id));
                });
            }, [history, orders, setHistory, setOrders, showConfirm]);

            return (
                <div className="flex h-screen overflow-hidden relative bg-gray-100 text-gray-900">
                    {/* MODAL CONFIG PRECIOS */}
                    {showPriceConfig && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl max-w-xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                                <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 shrink-0">
                                    <h2 className="text-xl font-bold flex items-center gap-2 text-gray-800"><Settings /> Configuración de Precios</h2>
                                    <button onClick={() => setShowPriceConfig(false)} className="text-gray-400 hover:text-gray-700 p-1 rounded hover:bg-gray-200"><X size={22} /></button>
                                </div>

                                <div className="p-4 overflow-y-auto flex-1 space-y-4">
                                    {/* CAJA */}
                                    <div className="bg-blue-50 p-3 rounded border border-blue-200">
                                        <label className="font-bold text-blue-800 block mb-1 flex items-center gap-2"><PackageIcon size={16} /> Precio de la Caja (por pizza)</label>
                                        <input type="number" key={`box-${showPriceConfig}`} defaultValue={localPrices.box || 0} onChange={e => setLocalPrices({ ...localPrices, box: parseInt(e.target.value) || 0 })} className="w-full p-2 border border-blue-300 rounded font-bold text-lg" />
                                    </div>
                                    {/* EMPANADAS */}
                                    <div className="bg-yellow-50 p-3 rounded border border-yellow-200">
                                        <label className="font-bold text-yellow-800 block mb-1">Precio Empanada Unitaria</label>
                                        <input type="number" key={`emp-${showPriceConfig}`} defaultValue={localPrices.empanada} onChange={e => setLocalPrices({ ...localPrices, empanada: parseInt(e.target.value) || 0 })} className="w-full p-2 border border-yellow-300 rounded font-bold text-lg" />
                                    </div>
                                    {/* MESA LIBRE */}
                                    <div className="bg-purple-50 p-3 rounded border border-purple-200">
                                        <label className="font-bold text-purple-800 block mb-1 flex items-center gap-2"><Users size={16} /> Precio Mesa Libre (por persona)</label>
                                        <input type="number" key={`libre-${showPriceConfig}`} defaultValue={localPrices.pizzaLibreH || 0} onChange={e => setLocalPrices({ ...localPrices, pizzaLibreH: parseInt(e.target.value) || 0 })} className="w-full p-2 border border-purple-300 rounded font-bold text-lg" />
                                    </div>
                                    {/* PIZZAS */}
                                    <div>
                                        <h3 className="font-bold border-b pb-2 text-orange-800 flex items-center gap-2"><Pizza size={16} /> Pizzas (Entera / Media)</h3>
                                        <div className="space-y-2 mt-2">
                                            {Object.keys(localPrices.flavors || {}).map(f => (
                                                <div key={f} className="flex gap-2 items-center bg-gray-50 p-2 rounded border border-gray-200">
                                                    <div className="flex-1 font-bold text-sm text-gray-700">{f}</div>
                                                    <input type="number" placeholder="Entera" defaultValue={localPrices.flavors[f]?.entera} onChange={e => setLocalPrices({ ...localPrices, flavors: { ...localPrices.flavors, [f]: { ...localPrices.flavors[f], entera: parseInt(e.target.value) || 0 } } })} className="w-24 p-1.5 border rounded text-center font-bold" />
                                                    <input type="number" placeholder="Media" defaultValue={localPrices.flavors[f]?.media} onChange={e => setLocalPrices({ ...localPrices, flavors: { ...localPrices.flavors, [f]: { ...localPrices.flavors[f], media: parseInt(e.target.value) || 0 } } })} className="w-24 p-1.5 border rounded text-center font-bold" />
                                                    <button onClick={() => { const { [f]: _, ...rest } = localPrices.flavors; setLocalPrices({ ...localPrices, flavors: rest }); }} className="text-red-400 hover:text-red-600 ml-1"><Trash2 size={16} /></button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2 mt-2">
                                            <input type="text" value={newFlavorName} onChange={e => setNewFlavorName(e.target.value)} placeholder="Nuevo gusto..." className="flex-1 p-2 border rounded text-sm" />
                                            <button onClick={() => { if (newFlavorName.trim()) { setLocalPrices({ ...localPrices, flavors: { ...localPrices.flavors, [newFlavorName.trim()]: { entera: 0, media: 0 } } }); setNewFlavorName(''); } }} className="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 rounded font-bold text-sm">+ Agregar</button>
                                        </div>
                                    </div>
                                    {/* BEBIDAS */}
                                    <div>
                                        <h3 className="font-bold border-b pb-2 text-blue-800 flex items-center gap-2"><CupSoda size={16} /> Bebidas</h3>
                                        <div className="space-y-2 mt-2">
                                            {Object.entries(localPrices.drinks || {}).map(([name, price]) => (
                                                <div key={name} className="flex gap-2 items-center bg-gray-50 p-2 rounded border border-gray-200">
                                                    <div className="flex-1 font-bold text-sm text-gray-700">{name}</div>
                                                    <input type="number" defaultValue={price} onChange={e => setLocalPrices({ ...localPrices, drinks: { ...localPrices.drinks, [name]: parseInt(e.target.value) || 0 } })} className="w-24 p-1.5 border rounded text-center font-bold" />
                                                    <button onClick={() => { const { [name]: _, ...rest } = localPrices.drinks; setLocalPrices({ ...localPrices, drinks: rest }); }} className="text-red-400 hover:text-red-600 ml-1"><Trash2 size={16} /></button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2 mt-2">
                                            <input type="text" value={newDrinkName} onChange={e => setNewDrinkName(e.target.value)} placeholder="Nombre bebida..." className="flex-1 p-2 border rounded text-sm" />
                                            <input type="number" value={newDrinkPrice} onChange={e => setNewDrinkPrice(e.target.value)} placeholder="Precio" className="w-24 p-2 border rounded text-sm text-center" />
                                            <button onClick={() => { if (newDrinkName.trim()) { setLocalPrices({ ...localPrices, drinks: { ...(localPrices.drinks || {}), [newDrinkName.trim()]: parseInt(newDrinkPrice) || 0 } }); setNewDrinkName(''); setNewDrinkPrice(''); } }} className="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded font-bold text-sm">+ Agregar</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 border-t border-gray-200 bg-gray-50 shrink-0 shadow-md">
                                    <button onClick={() => { setPrices(localPrices); setShowPriceConfig(false); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold text-lg shadow transition">GUARDAR Y CERRAR</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="w-1/2 bg-gray-50 flex flex-col border-r border-gray-300 shadow-xl z-10 h-full">
                        {/* HEADER */}
                        <div className="bg-gray-800 p-2 flex justify-between items-center text-white shrink-0 h-12">
                            <div className="flex gap-2 items-center"><button onClick={() => setView('landing')} className="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded font-bold">SALIR</button><span className="font-bold text-sm">RECEPCIÓN</span></div>
                            <div className="flex gap-3 items-center">
                                <button onClick={() => { setLocalPrices(prices); setShowPriceConfig(true); }} className="text-gray-300 hover:text-white" title="Configurar Precios"><Settings size={18} /></button>
                                <div className="text-xs bg-gray-700 px-2 rounded">v3.0 Rápida</div>
                            </div>
                        </div>

                        {/* INPUT CLIENTE - USANDO REF (NO RE-RENDERIZA) */}
                        <div className="bg-white p-3 border-b border-gray-200 shrink-0 shadow-sm z-20 space-y-3">
                            <div className="flex gap-2 items-start">
                                <div className="flex-1 bg-white rounded shadow-sm border border-gray-200 p-2">
                                    <label className="block text-[10px] font-bold text-gray-400 uppercase">Nombre Cliente / Mesa</label>
                                    <input ref={clientNameRef} type="text" className="w-full text-xl font-bold text-gray-800 p-1 border-b-2 border-gray-300 outline-none bg-transparent" placeholder="Ej: Pepe" autoFocus />
                                </div>
                                <button onClick={() => setIsLibre(!isLibre)} className={`flex flex-col items-center justify-center px-4 py-2 rounded border h-full ${isLibre ? 'bg-purple-100 border-purple-500 text-purple-700' : 'bg-white border-gray-300 text-gray-500'}`}><span className="text-xs font-black">{isLibre ? 'MESA LIBRE' : 'A LA CARTA'}</span><Users size={20} /></button>
                            </div>
                            {isLibre && (
                                <div className="mt-2 space-y-3">
                                    <div className="flex gap-2">
                                        <input ref={peopleQtyRef} type="number" placeholder="Cant. Personas" value={peopleQtyInput} onChange={e => setPeopleQtyInput(e.target.value)} className="w-36 p-2 border-2 border-purple-400 rounded text-center font-bold text-lg" />
                                        <input ref={libreObsRef} type="text" placeholder="Observación Mesa..." className="flex-1 p-2 border-2 border-purple-400 rounded" />
                                    </div>
                                    
                                    {/* LISTADO DE MESAS LIBRES POR LAS DUDAS AL INICIALIZAR */}
                                    <div className="bg-slate-200 border-2 border-purple-300 rounded-lg p-2 flex flex-col h-[55vh]">
                                        <div className="bg-purple-200 text-purple-900 px-3 py-1.5 rounded text-xs font-black uppercase flex justify-between items-center mb-2">
                                            <span className="flex items-center gap-1.5"><Users size={15} /> Mesas Libres Activas</span>
                                            <span className="bg-purple-700 text-white px-2 py-0.5 rounded-full text-[11px]">{activeLibres.length}</span>
                                        </div>
                                        <ActiveLibresList libres={activeLibres} onRound={handleRound} onClose={handleCloseLibre} />
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* PANEL CARTA */}
                        {!isLibre && (
                            <div className="flex-1 flex flex-col min-h-0 bg-gray-100 relative">
                                <div className="p-2.5 space-y-2.5 shrink-0 border-b border-gray-200 bg-gray-50 shadow-md z-10">
                                    {/* BOTONERA INTELIGENTE DE GUSTOS */}
                                    <div className="bg-orange-50 p-2.5 rounded-lg border border-orange-200 shadow-sm space-y-2">
                                        <div className="flex justify-between items-center">
                                            <div className="flex items-center gap-2">
                                                <h3 className="font-bold text-orange-900 flex items-center gap-1.5 text-sm">
                                                    <Pizza size={18} className="text-orange-600" /> Gustos de Pizza
                                                </h3>
                                                {selectedFlavors.length > 0 && (
                                                    <button onClick={() => setSelectedFlavors([])} className="text-xs text-orange-600 hover:text-orange-800 underline font-semibold">
                                                        Limpiar ({selectedFlavors.length})
                                                    </button>
                                                )}
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <label className={`flex items-center gap-1.5 cursor-pointer px-2 py-1 rounded border text-xs font-bold transition ${withBox ? 'bg-blue-100 border-blue-400 text-blue-700' : 'bg-white border-gray-300 text-gray-600'}`}>
                                                    <input type="checkbox" checked={withBox} onChange={e => setWithBox(e.target.checked)} className="w-3.5 h-3.5" />
                                                    <PackageIcon size={13} /> Caja (+${prices.box || 0})
                                                </label>
                                                {/* Selector Entera / Media SIEMPRE VISIBLE */}
                                                <div className="flex bg-white rounded border border-gray-300 overflow-hidden text-xs shadow-sm">
                                                    <button onClick={() => setPizzaTypeUI('entera')} className={`px-2.5 py-1 font-bold transition ${pizzaTypeUI === 'entera' ? 'bg-orange-500 text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Entera</button>
                                                    <button onClick={() => setPizzaTypeUI('mitad')} className={`px-2.5 py-1 font-bold transition ${pizzaTypeUI === 'mitad' ? 'bg-orange-500 text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Media</button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* GRID TÁCTIL DE GUSTOS (TOTALMENTE VISIBLE) */}
                                        <div className="grid grid-cols-3 sm:grid-cols-4 gap-1.5 p-1 bg-white/60 rounded border border-orange-100">
                                            {pizzaFlavors.map(f => {
                                                const idx = selectedFlavors.indexOf(f);
                                                const isSelected = idx !== -1;
                                                return (
                                                    <button
                                                        key={f}
                                                        type="button"
                                                        onClick={() => handleFlavorClick(f)}
                                                        className={`relative p-2 rounded-lg font-bold text-xs text-center border transition-all transform active:scale-95 flex flex-col items-center justify-center min-h-[42px] ${
                                                            isSelected 
                                                                ? 'bg-orange-500 text-white border-orange-600 shadow-md ring-2 ring-orange-400 font-black' 
                                                                : 'bg-white text-gray-800 border-gray-300 hover:bg-orange-100 hover:border-orange-300'
                                                        }`}
                                                    >
                                                        {isSelected && (
                                                            <span className="absolute -top-1.5 -right-1.5 bg-yellow-400 text-orange-950 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow border border-orange-600">
                                                                {idx + 1}º
                                                            </span>
                                                        )}
                                                        <span className="truncate w-full">{f}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {/* RESUMEN Y AGREGAR */}
                                        <div className="flex gap-2 items-center pt-1 border-t border-orange-200/60">
                                            <div className="flex-1 bg-white px-2.5 py-1.5 rounded border border-orange-200 text-xs truncate">
                                                {selectedFlavors.length === 0 ? (
                                                    <span className="text-gray-400 italic">👉 Tocá 1 o 2 gustos para armar la pizza</span>
                                                ) : (
                                                    <span className="font-bold text-orange-900">
                                                        🍕 {pizzaTypeUI === 'mitad' ? 'Media ' : ''}{selectedFlavors.length === 1 ? selectedFlavors[0] : selectedFlavors.join(' y ')}
                                                    </span>
                                                )}
                                            </div>
                                            <input ref={obsRef} type="text" placeholder="Obs..." className="w-24 p-1.5 border rounded text-xs bg-white" />
                                            <div className="flex items-center gap-1">
                                                <input ref={pizzaQtyRef} type="number" min="1" defaultValue="1" className="w-12 p-1.5 border rounded text-center font-bold text-xs" />
                                                <button 
                                                    onClick={addPizza} 
                                                    disabled={selectedFlavors.length === 0}
                                                    className={`px-3 py-1.5 rounded font-bold text-xs uppercase shadow transition ${selectedFlavors.length > 0 ? 'bg-orange-600 hover:bg-orange-700 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                                                >
                                                    + AGREGAR
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* EMPANADAS Y BEBIDAS RÁPIDAS */}
                                    <div className="flex gap-2 items-stretch">
                                        <div className="flex-[0.7] bg-yellow-50 p-2 rounded-lg border border-yellow-200 flex flex-col justify-center shadow-sm">
                                            <div className="flex items-center justify-center gap-1 mb-1"><Utensils size={14} className="text-yellow-700" /><span className="font-bold text-yellow-800 text-xs text-center leading-tight">Empanadas<br/>(${prices.empanada})</span></div>
                                            <input ref={empanadasRef} type="number" placeholder="0" value={empQtyInput} onChange={e => setEmpQtyInput(e.target.value)} className="w-full p-1.5 border border-yellow-300 rounded font-bold text-center text-lg" />
                                        </div>

                                        {/* BOTONERA EXPRESS DE BEBIDAS */}
                                        <div className="flex-[1.3] bg-blue-50 p-2 rounded-lg border border-blue-200 shadow-sm flex flex-col justify-between">
                                            <div className="flex justify-between items-center mb-1">
                                                <h3 className="font-bold text-blue-900 flex items-center gap-1 text-xs"><CupSoda size={14} className="text-blue-600" /> Bebidas Rápidas</h3>
                                                <span className="text-[10px] text-blue-600 font-semibold">Tap = +1</span>
                                            </div>
                                            {Object.keys(prices.drinks || {}).length === 0 ? (
                                                <div className="text-xs text-gray-400 italic text-center py-2">Sin bebidas cargadas</div>
                                            ) : (
                                                <div className="grid grid-cols-2 gap-1.5 p-0.5">
                                                    {Object.entries(prices.drinks || {}).map(([dName, dPrice]) => (
                                                        <button
                                                            key={dName}
                                                            type="button"
                                                            onClick={() => addDrinkQuick(dName)}
                                                            className="bg-white hover:bg-blue-100 text-blue-900 border border-blue-300 hover:border-blue-400 p-1.5 rounded text-xs font-bold shadow-sm active:scale-95 transition flex justify-between items-center text-left"
                                                        >
                                                            <span className="truncate mr-1">{dName}</span>
                                                            <span className="text-[10px] bg-blue-100 text-blue-800 px-1 py-0.5 rounded font-black shrink-0">${dPrice}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                {/* LISTA PIZZAS ACTUALES (Local, ligera) */}
                                <div className="flex-1 overflow-y-auto p-2 space-y-1 bg-gray-100">
                                    {currentPizzas.map((p) => (
                                        <div key={p.id} className="bg-white p-2 rounded border flex justify-between items-center shadow-sm text-sm">
                                            <div><span className="font-bold text-gray-800 mr-1">{p.qty}x</span> {p.description} {p.withBox && <span className="text-blue-600 font-bold text-xs">📦</span>} {p.obs && <span className="text-xs text-orange-600 italic">({p.obs})</span>}</div>
                                            <div className="flex items-center gap-2"><span className="text-xs font-bold bg-green-50 text-green-700 px-1 rounded border border-green-100">${(p.price * p.qty).toLocaleString()}</span><button onClick={() => setCurrentPizzas(currentPizzas.filter(x => x.id !== p.id))} className="text-red-400 hover:text-red-600"><Trash2 size={16} /></button></div>
                                        </div>
                                    ))}
                                    {currentDrinks.map((d) => (
                                        <div key={d.id} className="bg-white p-2 rounded border flex justify-between items-center shadow-sm text-sm">
                                            <div><span className="font-bold text-blue-800 mr-1">{d.qty}x</span> {d.name} <span className="text-xs text-blue-600 font-bold">🥤</span></div>
                                            <div className="flex items-center gap-2"><span className="text-xs font-bold bg-green-50 text-green-700 px-1 rounded border border-green-100">${(d.price * d.qty).toLocaleString()}</span><button onClick={() => setCurrentDrinks(currentDrinks.filter(x => x.id !== d.id))} className="text-red-400 hover:text-red-600"><Trash2 size={16} /></button></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* BOTÓN ENVIAR Y TOTAL DESTACADO */}
                        <div className="p-3 bg-white border-t border-gray-200 shrink-0 z-20 shadow-lg flex flex-col gap-2">
                            <div className={`flex justify-between items-center px-4 py-2.5 rounded-xl border shadow-sm ${isLibre ? 'bg-purple-50 border-purple-200' : 'bg-emerald-50 border-emerald-200'}`}>
                                <span className={`font-black text-sm uppercase tracking-wide flex items-center gap-1.5 ${isLibre ? 'text-purple-800' : 'text-emerald-800'}`}>
                                    <DollarSign size={18} className={isLibre ? 'text-purple-600' : 'text-emerald-600'} />
                                    {isLibre ? 'Total Estimado Mesa:' : 'Total Pedido:'}
                                </span>
                                <span className={`text-3xl font-black tracking-tight ${isLibre ? 'text-purple-700' : 'text-emerald-600'}`}>
                                    ${calculatedTotal.toLocaleString()}
                                </span>
                            </div>
                            <button onClick={submitOrder} className={`w-full py-3 rounded-lg font-bold text-xl text-white shadow transition ${isLibre ? 'bg-purple-600 hover:bg-purple-700' : 'bg-blue-600 hover:bg-blue-700'}`}>{isLibre ? 'INICIAR MESA LIBRE' : 'ENVIAR PEDIDO'}</button>
                        </div>
                    </div>

                    {/* LISTA COCINA Y MESAS LIBRES (COLUMNA DERECHA) */}
                    <div className="w-1/2 bg-slate-100 flex flex-col h-full overflow-hidden border-l border-gray-300">
                        <div className="p-3 bg-slate-800 text-white shadow-md flex justify-between items-center shrink-0">
                            <h2 className="font-bold flex items-center gap-2 text-sm"><Monitor size={18} /> Pedidos Cocina</h2>
                            <span className="text-xs bg-slate-700 px-2 py-0.5 rounded-full font-bold">{orders.length}</span>
                        </div>
                        
                        {/* GRID 2 COLUMNAS DE PEDIDOS DE COCINA */}
                        <KitchenOrdersList orders={orders} onComplete={handleCompleteOrder} onDelete={handleDeleteOrder} prices={prices} />

                        {/* MESAS LIBRES ACTIVAS EN COLUMNA DERECHA (TAMAÑO MÁS GRANDE: 32vh) */}
                        <div className="bg-slate-200 border-t-4 border-slate-300 shrink-0 h-[32vh] flex flex-col shadow-inner">
                            <div className="bg-slate-300 px-3 py-2 text-xs font-bold text-slate-800 uppercase flex justify-between items-center border-b border-slate-400/50">
                                <span className="flex items-center gap-1.5"><Users size={16} className="text-purple-600" /> Mesas Libres Activas</span>
                                <span className="bg-purple-600 text-white px-2.5 py-0.5 rounded-full font-black text-xs">{activeLibres.length}</span>
                            </div>
                            <ActiveLibresList libres={activeLibres} onRound={handleRound} onClose={handleCloseLibre} />
                        </div>
                    </div>
                </div>
            );
        };

        const KitchenView = ({ setView, orders, setOrders, history, setHistory, showConfirm, showAlert, prices }) => {
            const [zoom, setZoom] = useState(1);
            const [showTotal, setShowTotal] = useState(false);

            const handleComplete = (o) => {
                if (o.type === 'libre') {
                    setHistory([...history, { ...o, completedAt: new Date().toISOString() }]);
                    setOrders(orders.filter(x => x.id !== o.id));
                    return;
                }
                showConfirm('¿Marcar como completado? Esto lo sumará al total.', () => {
                    setHistory([...history, { ...o, completedAt: new Date().toISOString() }]);
                    setOrders(orders.filter(x => x.id !== o.id));
                });
            };

            return (
                <div className="bg-black min-h-screen text-white flex flex-col overflow-hidden relative">
                    {showTotal && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="bg-white text-black p-8 rounded-2xl max-w-sm w-full shadow-2xl">
                                <h2 className="text-2xl font-bold mb-4 flex items-center justify-center gap-2 text-green-700"><DollarSign size={28} /> Total A La Carta</h2>
                                <div className="text-5xl font-black text-center my-6">${history.filter(o => o.type !== 'libre').reduce((sum, o) => sum + (o.totalPrice || 0), 0).toLocaleString()}</div>
                                <div className="text-gray-500 text-center mb-6">{history.filter(o => o.type !== 'libre').length} pedidos para llevar completados</div>
                                <div className="text-sm text-gray-400 text-center mb-6 italic">* No incluye mesas libres (se cobran por persona).</div>
                                <button onClick={() => setShowTotal(false)} className="w-full bg-gray-200 hover:bg-gray-300 py-3 rounded-lg font-bold text-lg">CERRAR</button>
                            </div>
                        </div>
                    )}

                    <div className="bg-red-800 p-3 flex justify-between items-center shadow-lg border-b-4 border-red-900 z-10">
                        <h1 className="text-2xl font-bold uppercase tracking-wider flex items-center gap-3"><ChefHat size={32} /> COCINA</h1>
                        <div className="flex gap-2 items-center">
                            <button onClick={() => setShowTotal(true)} className="bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-white font-bold flex items-center gap-2 shadow"><DollarSign size={20} /> TOTAL</button>
                            <button onClick={() => setZoom(z => Math.max(0.6, z - 0.1))} className="bg-white/10 p-2 rounded ml-4 hover:bg-white/20"><ZoomOut size={20} /></button>
                            <button onClick={() => setZoom(z => Math.min(1.6, z + 0.1))} className="bg-white/10 p-2 rounded hover:bg-white/20"><ZoomIn size={20} /></button>
                            <button onClick={() => setView('landing')} className="text-xs ml-4 text-red-300 underline self-center hover:text-white">Salir</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-auto p-4 bg-zinc-900">
                        {orders.length === 0 ? <div className="h-full flex flex-col items-center justify-center opacity-30"><ChefHat size={120} /><h2 className="text-4xl font-bold mt-4">Esperando...</h2></div> : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 items-start content-start" style={{ zoom: zoom }}>
                                {orders.map((o) => (
                                    <div key={o.id} className={`relative rounded-lg overflow-hidden shadow-2xl ${o.type === 'libre' ? 'bg-indigo-900 ring-2 ring-indigo-500' : 'bg-gray-800 ring-1 ring-gray-700'}`}>
                                        <div className={`p-3 flex justify-between items-start border-b border-white/10 ${o.type === 'libre' ? 'bg-indigo-800' : 'bg-gray-700'}`}>
                                            <div className="overflow-hidden"><h3 className="text-3xl font-black text-yellow-400 truncate leading-none mb-1">{o.client}</h3><div className="flex items-center gap-2 text-gray-300 font-mono text-sm"><span>{o.timestamp}</span>{o.type === 'libre' && <span className="text-indigo-200 font-bold">• MESA LIBRE</span>}</div></div>
                                            <div className="flex gap-1">
                                                <button onClick={() => handleComplete(o)} className="bg-green-600/50 hover:bg-green-600 text-white px-3 py-2 rounded font-bold flex items-center gap-1" title="Completar"><Check size={20} /> Listo</button>
                                            </div>
                                        </div>
                                        <div className="p-4 space-y-4">
                                            {o.type === 'libre' && (<div className="bg-indigo-950/50 p-3 rounded border border-indigo-500/50 text-center space-y-2"><div className="text-sm text-indigo-300 uppercase font-bold tracking-widest">{o.round === 1 ? 'PRIMER LIBRE' : `${o.round}ª RONDA`}</div><div className="text-5xl font-bold text-white flex items-center justify-center gap-2"><Users size={40} /> {o.people}</div></div>)}
                                            {o.obs && <div className="bg-yellow-900/60 p-3 rounded border-l-4 border-yellow-500 flex items-start gap-3"><AlertCircle className="text-yellow-400 shrink-0 mt-1" size={24} /><span className="text-xl font-bold text-yellow-100 uppercase">{o.obs}</span></div>}
                                            {o.pizzas.length > 0 && <ul className="space-y-3">{o.pizzas.map((p, i) => (<li key={i} className="border-b border-white/10 pb-2 last:border-0 last:pb-0"><div className="text-2xl font-bold leading-tight"><span className="text-green-400 inline-block w-8 text-right mr-2">{p.qty}x</span><span className="text-gray-100">{p.description}</span></div>{p.obs && <div className="mt-1 ml-10 bg-yellow-900/50 text-yellow-200 px-2 py-1 rounded text-lg font-bold border border-yellow-700/50 flex items-center gap-2"><AlertCircle size={18} /> {p.obs}</div>}</li>))}</ul>}
                                            {o.drinks && o.drinks.length > 0 && <ul className="space-y-3 mt-3">{o.drinks.map((d, i) => (<li key={`d${i}`} className="border-b border-white/10 pb-2 last:border-0 last:pb-0"><div className="text-2xl font-bold leading-tight text-blue-300"><span className="text-blue-400 inline-block w-8 text-right mr-2">{d.qty}x</span><span className="text-gray-100">{d.name}</span></div></li>))}</ul>}
                                            {o.empanadas > 0 && <div className="bg-yellow-900/30 p-2 rounded border border-yellow-600/30 mt-2 flex items-center gap-3"><span className="text-3xl font-bold text-yellow-400 w-10 text-right">{o.empanadas}</span><span className="text-lg font-bold text-yellow-100 uppercase tracking-wide">Empanadas</span></div>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BochasApp />);
    </script>
</body>

</html>
